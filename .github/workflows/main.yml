name: Build Z Plus Security 3D APK (Digital Doctor Edition)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build & Optimize Z Plus Security APK
    runs-on: ubuntu-latest

    steps:
      # =========================================================
      # 01 - CHECKOUT REPOSITORY
      # =========================================================
      - name: 01 - Checkout Repository
        uses: actions/checkout@v4

      # =========================================================
      # 02 - SETUP JAVA 17 WITH CACHING (FAST BUILD)
      # =========================================================
      - name: 02 - Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle' # कैशिंग से बिल्ड टाइम आधा हो जाएगा

      # =========================================================
      # 03 - SETUP GRADLE 8.5
      # =========================================================
      - name: 03 - Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      # =========================================================
      # 04 - CLEAN & CREATE DIRECTORY STRUCTURE
      # =========================================================
      - name: 04 - Setup Directory Tree
        run: |
          set -euo pipefail
          rm -rf app .gradle settings.gradle build.gradle gradle.properties
          mkdir -p app/src/main/java/com/zplussecurity/app
          mkdir -p app/src/main/assets/models
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

      # =========================================================
      # 05 - DOWNLOAD REAL AI MODEL (TENSORFLOW OFFICIAL)
      # =========================================================
      - name: 05 - Download AI Model
        run: |
          # TensorFlow के ऑफिशियल गिटहब सर्वर से असली .tflite मॉडल डाउनलोड कर रहे हैं
          curl -L -o app/src/main/assets/models/diagnostic_model.tflite "https://raw.githubusercontent.com/tensorflow/tflite-support/master/tensorflow_lite_support/metadata/java/src/test/testdata/vision/mobilenet_v1_1.0_224_quant.tflite"
          
          # चेक करें कि फाइल सफलतापूर्वक डाउनलोड हुई या नहीं
          if [ ! -f "app/src/main/assets/models/diagnostic_model.tflite" ]; then
            echo "Model download failed!"
            exit 1
          fi

      # =========================================================
      # 06 - GRADLE PROPERTIES & SETTINGS (OPTIMIZED FOR SPEED)
      # =========================================================
      - name: 06 - Create Gradle Properties & Settings
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.daemon=false
          EOF
          
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ZPlusSecurity"
          include(":app")
          EOF

      # =========================================================
      # 07 - ROOT BUILD GRADLE
      # =========================================================
      - name: 07 - Create Root Build Gradle
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.2.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          EOF

      # =========================================================
      # 08 - APP BUILD GRADLE (FIXED SYNTAX)
      # =========================================================
      - name: 08 - Create App Build Gradle
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }

          android {
              namespace "com.zplussecurity.app"
              compileSdk 34

              defaultConfig {
                  applicationId "com.zplussecurity.app"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "2.0.0" // Version upgraded to 2.0 (Doctor Edition)
              }
              
              androidResources {
                  noCompress 'tflite'
              }

              buildTypes { debug { minifyEnabled false } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation "androidx.core:core-ktx:1.13.1"
              implementation "androidx.appcompat:appcompat:1.7.0"
              implementation "com.google.android.material:material:1.12.0"
              implementation "org.json:json:20240303"
              
              implementation "org.tensorflow:tensorflow-lite:2.14.0"
              implementation "org.tensorflow:tensorflow-lite-support:0.4.4"
          }
          EOF

      # =========================================================
      # 09 - MINIMAL MANIFEST & RESOURCES
      # =========================================================
      - name: 09 - Create Android Manifest & Minimal Res
        run: |
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">Z Plus Security</string></resources>
          EOF
          
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?><resources><style name="Theme.ZPlusSecurity" parent="Theme.AppCompat.DayNight.NoActionBar" /></resources>
          EOF
          
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.KILL_BACKGROUND_PROCESSES" />
              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.ZPlusSecurity">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      # =========================================================
      # 10 - MAIN ACTIVITY KOTLIN
      # =========================================================
      - name: 10 - Create MainActivity
        run: |
          cat > app/src/main/java/com/zplussecurity/app/MainActivity.kt <<'EOF'
          package com.zplussecurity.app
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import org.tensorflow.lite.Interpreter
          import java.io.FileInputStream
          import java.nio.MappedByteBuffer
          import java.nio.channels.FileChannel

          class MainActivity : AppCompatActivity() {
              private var tflite: Interpreter? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  try {
                      tflite = Interpreter(loadModelFile())
                      println("AI Model Loaded Successfully")
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              private fun loadModelFile(): MappedByteBuffer {
                  val fileDescriptor = assets.openFd("models/diagnostic_model.tflite")
                  val inputStream = FileInputStream(fileDescriptor.fileDescriptor)
                  val fileChannel = inputStream.channel
                  return fileChannel.map(FileChannel.MapMode.READ_ONLY, fileDescriptor.startOffset, fileDescriptor.declaredLength)
              }
          }
          EOF

      # =========================================================
      # 11 - BUILD APK (PARALLEL MODE)
      # =========================================================
      - name: 11 - Build APK
        run: |
          set -euo pipefail
          # --parallel और --no-daemon बिल्ड को तेज और स्थिर बनाते हैं
          gradle :app:assembleDebug --no-daemon --parallel

      # =========================================================
      # 12 - UPLOAD FINAL APK
      # =========================================================
      - name: 12 - Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Z-Plus-Doctor-APK
          path: app/build/outputs/apk/debug/app-debug.apk

