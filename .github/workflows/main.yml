name: Build Z Plus Security 3D APK (Digital Doctor Edition)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Z Plus Security Android APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 01 - CHECKOUT REPOSITORY
      # =========================================================
      - name: 01 - Checkout Repository
        uses: actions/checkout@v4


      # =========================================================
      # 02 - SETUP JAVA 17
      # =========================================================
      - name: 02 - Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'


      # =========================================================
      # 03 - SETUP GRADLE 8.5
      # =========================================================
      - name: 03 - Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"


      # =========================================================
      # 04 - CLEAN & CREATE DIRECTORY STRUCTURE
      # =========================================================
      - name: 04 - Setup Directory Tree
        run: |
          set -euo pipefail
          rm -rf app .gradle settings.gradle build.gradle gradle.properties
          mkdir -p app/src/main/java/com/zplussecurity/app
          mkdir -p app/src/main/assets/models  # AI Models के लिए नया फोल्डर
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

      # =========================================================
      # 05 - DOWNLOAD / CREATE DUMMY AI MODEL
      # =========================================================
      - name: 05 - Setup AI Model (TFLite)
        run: |
          # यह TFLite मॉडल का प्लेसहोल्डर है। (भविष्य में यहाँ असली 50MB मॉडल का URL डाल सकते हैं)
          echo "Dummy AI Model for Compilation" > app/src/main/assets/models/diagnostic_model.tflite


      # =========================================================
      # 06 - GRADLE PROPERTIES & SETTINGS
      # =========================================================
      - name: 06 - Create Gradle Properties & Settings
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.daemon=false
          EOF
          
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ZPlusSecurity"
          include(":app")
          EOF


      # =========================================================
      # 07 - ROOT BUILD GRADLE
      # =========================================================
      - name: 07 - Create Root Build Gradle
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.2.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          EOF


      # =========================================================
      # 08 - APP BUILD GRADLE (ADDED AI & TFLITE SUPPORT)
      # =========================================================
      - name: 08 - Create App Build Gradle
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }

          android {
              namespace "com.zplussecurity.app"
              compileSdk 34

              defaultConfig {
                  applicationId "com.zplussecurity.app"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "2.0.0" # Version upgraded to 2.0 (Doctor Edition)
              }
              
              androidResources {
                  noCompress 'tflite' // AI मॉडल को कंप्रेस होने से रोकना जरूरी है
              }

              buildTypes { debug { minifyEnabled false } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation "androidx.core:core-ktx:1.13.1"
              implementation "androidx.appcompat:appcompat:1.7.0"
              implementation "com.google.android.material:material:1.12.0"
              implementation "org.json:json:20240303"
              
              // TensorFlow Lite (AI Brain Dependencies)
              implementation "org.tensorflow:tensorflow-lite:2.14.0"
              implementation "org.tensorflow:tensorflow-lite-support:0.4.4"
          }
          EOF


      # =========================================================
      # 09 - VALUES & LAYOUT (UI SETUP)
      # =========================================================
      - name: 09 - Create Values & Layout
        run: |
          # (Colors, Strings, Themes - Same as before)
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?><resources><color name="black">#000000</color><color name="gold_z">#FFD700</color><color name="neon_red">#FF0055</color><color name="neon_green">#00FF88</color><color name="shield_dark">#050B14</color></resources>
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">जेड प्लस सिक्योरिटी</string></resources>
          EOF
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?><resources><style name="Theme.ZPlusSecurity" parent="Theme.AppCompat.DayNight.NoActionBar"><item name="android:windowFullscreen">true</item><item name="android:navigationBarColor">#050B14</item><item name="android:statusBarColor">#050B14</item></style></resources>
          EOF
          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?><FrameLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#050B14"><WebView android:id="@+id/webView" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#050B14" /></FrameLayout>
          EOF


      # =========================================================
      # 10 - ANDROID MANIFEST (ADDED NEW PERMISSIONS)
      # =========================================================
      - name: 10 - Create Android Manifest
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <!-- पुरानी परमिशन -->
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" tools:ignore="QueryAllPackagesPermission" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" tools:ignore="ScopedStorage" />
              <uses-permission android:name="android.permission.REQUEST_DELETE_PACKAGES" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.INTERNET" />
              
              <!-- नई परमिशन: डॉक्टर इंजन के लिए (रैम और बैकग्राउंड क्लियर करने के लिए) -->
              <uses-permission android:name="android.permission.KILL_BACKGROUND_PROCESSES" />
              <uses-permission android:name="android.permission.CLEAR_APP_CACHE" tools:ignore="ProtectedPermissions"/>

              <application
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.ZPlusSecurity">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF


      # =========================================================
      # 11 - MAIN ACTIVITY (KOTLIN) - DIGITAL DOCTOR ENGINE
      # =========================================================
      - name: 11 - Create MainActivity Kotlin Code
        run: |
          cat > app/src/main/java/com/zplussecurity/app/MainActivity.kt <<'EOF'
          package com.zplussecurity.app

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.ActivityManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ApplicationInfo
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.provider.Settings
          import android.speech.tts.TextToSpeech
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import org.json.JSONArray
          import org.json.JSONObject
          import org.tensorflow.lite.Interpreter // AI इंजन इम्पोर्ट
          import java.io.File
          import java.util.Locale

          class MainActivity : AppCompatActivity(), TextToSpeech.OnInitListener {

              private lateinit var webView: WebView
              private var tts: TextToSpeech? = null
              private var isTtsReady = false
              private var tfliteInterpreter: Interpreter? = null // AI Brain

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.setFlags(
                      android.view.WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      android.view.WindowManager.LayoutParams.FLAG_FULLSCREEN
                  )
                  setContentView(R.layout.activity_main)

                  tts = TextToSpeech(this, this)
                  webView = findViewById(R.id.webView)
                  
                  setupWebView()
                  requestPermissionsOnStart()
              }

              private fun requestPermissionsOnStart() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      if (!Environment.isExternalStorageManager()) {
                          Toast.makeText(this, "कृपया स्कैनिंग के लिए All Files Access दें", Toast.LENGTH_LONG).show()
                          try {
                              val intent = Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION)
                              intent.data = Uri.parse("package:$packageName")
                              startActivity(intent)
                          } catch (e: Exception) {
                              startActivity(Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION))
                          }
                      }
                  } else {
                      val writePermission = ContextCompat.checkSelfPermission(this, Manifest.permission.WRITE_EXTERNAL_STORAGE)
                      if (writePermission != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.READ_EXTERNAL_STORAGE, Manifest.permission.WRITE_EXTERNAL_STORAGE), 101)
                      }
                  }
              }

              private fun setupWebView() {
                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      allowFileAccess = true
                      allowContentAccess = true
                      mediaPlaybackRequiresUserGesture = false
                  }
                  webView.webViewClient = WebViewClient()
                  webView.webChromeClient = WebChromeClient()
                  webView.addJavascriptInterface(ZPlusSecurityBridge(), "AndroidSecurity")
                  webView.loadUrl("file:///android_asset/index.html")
              }

              inner class ZPlusSecurityBridge {

                  // 🚀 THE DIGITAL DOCTOR SCAN ENGINE (AI + Hardware) 🚀
                  @JavascriptInterface
                  fun runDoctorScan(): String {
                      val threatsArray = JSONArray()
                      try {
                          // 1. RAM & System Diagnostic (Hardware Check)
                          val actManager = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                          val memInfo = ActivityManager.MemoryInfo()
                          actManager.getMemoryInfo(memInfo)
                          
                          val percentUsed = ((memInfo.totalMem - memInfo.availMem).toFloat() / memInfo.totalMem) * 100
                          
                          if (percentUsed > 65) {
                              val ramItem = JSONObject().apply {
                                  put("type", "SYSTEM_RAM")
                                  put("name", "High RAM Usage (${percentUsed.toInt()}%)")
                                  put("target", "RAM_CLEAN")
                                  put("location", "System Memory")
                                  put("risk", "Slowing down mobile touch & speed")
                              }
                              threatsArray.put(ramItem)
                          }

                          // 2. Junk & Cache Diagnostic
                          val cacheSizeMB = (50..500).random() // Simulation API (Needs StorageStatsManager for deep info)
                          val junkItem = JSONObject().apply {
                              put("type", "SYSTEM_JUNK")
                              put("name", "System Cache & Junk Files")
                              put("target", "JUNK_CLEAN")
                              put("location", "${cacheSizeMB} MB of hidden trash")
                              put("risk", "Wasting storage & causing lag")
                          }
                          threatsArray.put(junkItem)

                          // 3. Hidden Malware Scan (Your original code)
                          val pm = packageManager
                          val packages = pm.getInstalledPackages(0)
                          for (pkg in packages) {
                              val isSystem = (pkg.applicationInfo.flags and ApplicationInfo.FLAG_SYSTEM) != 0
                              val launchIntent = pm.getLaunchIntentForPackage(pkg.packageName)

                              if (!isSystem && launchIntent == null && pkg.packageName != packageName) {
                                  val item = JSONObject().apply {
                                      put("type", "HIDDEN_APP")
                                      put("name", pkg.applicationInfo.loadLabel(pm).toString().ifEmpty { "Suspicious Payload" })
                                      put("target", pkg.packageName)
                                      put("location", "Background Package")
                                      put("risk", "High Risk Malware")
                                  }
                                  threatsArray.put(item)
                              }
                          }
                          
                          // (AI Model Interpreter can analyze this JSON here in future updates)

                      } catch (e: Exception) { e.printStackTrace() }
                      return threatsArray.toString()
                  }

                  // 🚀 THE FIX ENGINE (Hand of the Doctor) 🚀
                  @JavascriptInterface
                  fun fixSystemIssue(target: String): Boolean {
                      return try {
                          when (target) {
                              "RAM_CLEAN" -> {
                                  // Kills background processes to free up RAM
                                  val actManager = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                                  val packages = packageManager.getInstalledPackages(0)
                                  for (pkg in packages) {
                                      if ((pkg.applicationInfo.flags and ApplicationInfo.FLAG_SYSTEM) == 0 && pkg.packageName != packageName) {
                                          actManager.killBackgroundProcesses(pkg.packageName)
                                      }
                                  }
                                  true
                              }
                              "JUNK_CLEAN" -> {
                                  // Clears accessible app cache directories
                                  cacheDir.deleteRecursively()
                                  externalCacheDir?.deleteRecursively()
                                  true
                              }
                              else -> false
                          }
                      } catch (e: Exception) { false }
                  }

                  // Original Features (Delete file, Uninstall App, TTS, Vibrate)
                  @JavascriptInterface
                  fun deleteFileThreat(filePath: String) = try { File(filePath).apply { if(exists()) delete() } != null } catch(e:Exception){false}

                  @JavascriptInterface
                  fun uninstallAppThreat(pkgName: String) = runOnUiThread {
                      try { startActivity(Intent(Intent.ACTION_UNINSTALL_PACKAGE).apply { data = Uri.parse("package:$pkgName") }) } catch (e: Exception) {}
                  }

                  @JavascriptInterface
                  fun speakAlert(message: String) = runOnUiThread { if (isTtsReady) tts?.speak(message, TextToSpeech.QUEUE_FLUSH, null, "ZPLUS") }

                  @JavascriptInterface
                  fun triggerVibration() = runOnUiThread {
                      try {
                          val vibrator = getSystemService(VIBRATOR_SERVICE) as Vibrator
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) vibrator.vibrate(VibrationEffect.createOneShot(50L, VibrationEffect.DEFAULT_AMPLITUDE)) else vibrator.vibrate(50L)
                      } catch (e: Exception) {}
                  }
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      isTtsReady = true
                      tts?.language = Locale("hi", "IN")
                  }
              }
              override fun onDestroy() { tts?.stop(); tts?.shutdown(); super.onDestroy() }
          }
          EOF


      # =========================================================
      # 12 - WEBGL THREE.JS 3D HUD & SCANNER INTERFACE
      # =========================================================
      - name: 12 - Create WebGL 3D UI
        run: |
          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="hi">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
          <title>Z Plus Digital Doctor</title>
          <style>
              * { box-sizing: border-box; user-select: none; }
              html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; background: #050b14; font-family: sans-serif; overflow: hidden; }
              #webgl-container { position: absolute; inset: 0; z-index: 1; }
              .ui-layer { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; pointer-events: none; }
              .brand-title { text-align: center; font-size: 24px; font-weight: 900; color: #ffd700; text-shadow: 0 0 15px rgba(255,215,0,0.6); margin-top: 10px; }
              .sub-status { text-align: center; color: #00ff88; font-size: 12px; font-weight: bold; margin-top: 5px; }
              .action-box { align-self: center; pointer-events: auto; margin-bottom: 20px; }
              .btn-scan { background: linear-gradient(135deg, #00ff88, #008855); color: #000; border: none; padding: 18px 40px; border-radius: 30px; font-size: 16px; font-weight: 900; box-shadow: 0 0 20px #00ff88; cursor: pointer; transition: 0.2s; }
              .btn-scan:active { transform: scale(0.95); }
              .modal { position: absolute; inset: 0; z-index: 20; background: rgba(5,11,20,0.95); display: none; flex-direction: column; padding: 20px; overflow-y: auto; }
              .modal.active { display: flex; }
              .modal-header { font-size: 20px; color: #ff0055; font-weight: bold; border-bottom: 1px solid #ff0055; padding-bottom: 10px; margin-bottom: 15px; display: flex; justify-content: space-between;}
              .card { background: rgba(255,0,85,0.1); border: 1px solid rgba(255,0,85,0.4); border-radius: 10px; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
              .card.system { background: rgba(255,215,0,0.1); border-color: #ffd700; }
              .card-title { color: #fff; font-weight: bold; font-size: 15px; }
              .card-desc { color: #aaa; font-size: 12px; margin-top: 5px; }
              .card-risk { color: #ff0055; font-size: 12px; font-weight: bold; margin-top: 5px; }
              .card.system .card-risk { color: #ffd700; }
              .btn-fix { background: #ff0055; color: #fff; padding: 10px 15px; border: none; border-radius: 5px; font-weight: bold; pointer-events: auto; }
              .card.system .btn-fix { background: #ffd700; color: #000; }
              .btn-fix-all { background: linear-gradient(135deg, #ff0055, #990033); color: #fff; padding: 15px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; margin-top: auto; pointer-events: auto; }
          </style>
          <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
          </head>
          <body>
          <div id="webgl-container"></div>
          <div class="ui-layer">
              <div>
                  <div class="brand-title">Z PLUS DOCTOR</div>
                  <div class="sub-status" id="statusText">SYSTEM READY</div>
              </div>
              <div class="action-box">
                  <button class="btn-scan" id="scanBtn" onclick="startScan()">DEEP SCAN & DIAGNOSE</button>
              </div>
          </div>
          
          <div class="modal" id="resultModal">
              <div class="modal-header">
                  <span id="issueCount">DIAGNOSIS REPORT (0)</span>
                  <span onclick="closeModal()" style="color:#fff; cursor:pointer;">✕</span>
              </div>
              <div id="listContainer"></div>
              <button class="btn-fix-all" onclick="fixAll()">FIX & BOOST EVERYTHING</button>
          </div>

          <script>
          function nativeCall(method, arg="") {
              try { if (window.AndroidSecurity && window.AndroidSecurity[method]) return window.AndroidSecurity[method](arg); } catch(e){} return "";
          }

          // Simple Three.js Setup (Shield)
          const scene = new THREE.Scene();
          const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100); camera.position.z = 7;
          const renderer = new THREE.WebGLRenderer({alpha: true}); renderer.setSize(window.innerWidth, window.innerHeight);
          document.getElementById('webgl-container').appendChild(renderer.domElement);
          
          const shieldGeo = new THREE.CylinderGeometry(1.5, 1.5, 0.2, 6);
          const shieldMat = new THREE.MeshBasicMaterial({color: 0x00ff88, wireframe: true});
          const shield = new THREE.Mesh(shieldGeo, shieldMat);
          shield.rotation.x = Math.PI / 2;
          scene.add(shield);

          let isScanning = false;
          let issues = [];

          function animate() {
              requestAnimationFrame(animate);
              shield.rotation.y += isScanning ? 0.1 : 0.005;
              renderer.render(scene, camera);
          } animate();

          function startScan() {
              nativeCall("triggerVibration");
              nativeCall("speakAlert", "सिस्टम डायग्नोस्टिक स्कैन शुरू हो रहा है");
              isScanning = true;
              document.getElementById('statusText').innerText = "SCANNING HARDWARE, RAM & MALWARE...";
              document.getElementById('scanBtn').style.opacity = "0.5";

              setTimeout(() => {
                  const resultStr = nativeCall("runDoctorScan");
                  try { issues = JSON.parse(resultStr || "[]"); } catch(e){ issues = []; }
                  isScanning = false;
                  document.getElementById('scanBtn').style.opacity = "1";

                  if (issues.length > 0) {
                      nativeCall("speakAlert", "स्कैन पूरा हुआ। आपके फोन में " + issues.length + " कमियां पाई गई हैं।");
                      showModal();
                  } else {
                      document.getElementById('statusText').innerText = "SYSTEM 100% HEALTHY";
                      nativeCall("speakAlert", "आपका मोबाइल बिल्कुल सही चल रहा है");
                  }
              }, 3000);
          }

          function showModal() {
              document.getElementById('resultModal').classList.add('active');
              document.getElementById('issueCount').innerText = `DIAGNOSIS REPORT (${issues.length})`;
              const container = document.getElementById('listContainer');
              container.innerHTML = "";
              
              issues.forEach((item, i) => {
                  const isSystem = item.type.includes("SYSTEM");
                  container.innerHTML += `
                      <div class="card ${isSystem ? 'system' : ''}">
                          <div>
                              <div class="card-title">${item.name}</div>
                              <div class="card-desc">${item.location}</div>
                              <div class="card-risk">${item.risk}</div>
                          </div>
                          <button class="btn-fix" onclick="fixSingle(${i})">${isSystem ? 'BOOST' : 'DELETE'}</button>
                      </div>
                  `;
              });
          }

          function closeModal() { document.getElementById('resultModal').classList.remove('active'); }

          function fixSingle(index) {
              nativeCall("triggerVibration");
              const item = issues[index];
              if(item.type.includes("SYSTEM")) nativeCall("fixSystemIssue", item.target);
              else if(item.type === "HIDDEN_APP") nativeCall("uninstallAppThreat", item.target);
              else if(item.type === "FILE") nativeCall("deleteFileThreat", item.target);
              
              issues.splice(index, 1);
              if(issues.length === 0) { closeModal(); document.getElementById('statusText').innerText = "SYSTEM OPTIMIZED & SECURED"; nativeCall("speakAlert", "सिस्टम फिक्स हो गया है"); }
              else { showModal(); }
          }

          function fixAll() {
              nativeCall("triggerVibration");
              nativeCall("speakAlert", "सभी समस्याओं को फिक्स किया जा रहा है");
              issues.forEach(item => {
                  if(item.type.includes("SYSTEM")) nativeCall("fixSystemIssue", item.target);
                  else if(item.type === "HIDDEN_APP") nativeCall("uninstallAppThreat", item.target);
              });
              issues = [];
              closeModal();
              document.getElementById('statusText').innerText = "PHONE BOOSTED & SECURED";
          }
          </script>
          </body>
          </html>
          EOF


      # =========================================================
      # 13 - BUILD GRADLE DEBUG APK
      # =========================================================
      - name: 13 - Build APK
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon


      # =========================================================
      # 14 - RENAME & UPLOAD APK
      # =========================================================
      - name: 14 - Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Z-Plus-Doctor-APK
          path: app/build/outputs/apk/debug/app-debug.apk
