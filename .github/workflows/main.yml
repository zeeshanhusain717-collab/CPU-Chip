name: Build Z Plus Security 3D APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Z Plus Security Android APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 01 - CHECKOUT REPOSITORY
      # =========================================================
      - name: 01 - Checkout Repository
        uses: actions/checkout@v4


      # =========================================================
      # 02 - SETUP JAVA 17
      # =========================================================
      - name: 02 - Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'


      # =========================================================
      # 03 - SETUP GRADLE 8.5
      # =========================================================
      - name: 03 - Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"


      # =========================================================
      # 04 - CLEAN & CREATE DIRECTORY STRUCTURE
      # =========================================================
      - name: 04 - Setup Directory Tree
        run: |
          set -euo pipefail

          rm -rf app .gradle settings.gradle build.gradle gradle.properties

          mkdir -p app/src/main/java/com/zplussecurity/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi


      # =========================================================
      # 05 - GRADLE PROPERTIES
      # =========================================================
      - name: 05 - Create Gradle Properties
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.daemon=false
          EOF


      # =========================================================
      # 06 - SETTINGS GRADLE
      # =========================================================
      - name: 06 - Create Settings Gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ZPlusSecurity"
          include(":app")
          EOF


      # =========================================================
      # 07 - ROOT BUILD GRADLE
      # =========================================================
      - name: 07 - Create Root Build Gradle
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.2.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          EOF


      # =========================================================
      # 08 - APP BUILD GRADLE
      # =========================================================
      - name: 08 - Create App Build Gradle
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }

          android {
              namespace "com.zplussecurity.app"
              compileSdk 34

              defaultConfig {
                  applicationId "com.zplussecurity.app"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation "androidx.core:core-ktx:1.13.1"
              implementation "androidx.appcompat:appcompat:1.7.0"
              implementation "com.google.android.material:material:1.12.0"
              implementation "org.json:json:20240303"
          }
          EOF


      # =========================================================
      # 09 - VALUES & APP ICON DRAWABLES
      # =========================================================
      - name: 09 - Create App Icons & Resource Files
        run: |
          # Colors
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="black">#000000</color>
              <color name="gold_z">#FFD700</color>
              <color name="neon_red">#FF0055</color>
              <color name="neon_green">#00FF88</color>
              <color name="shield_dark">#050B14</color>
          </resources>
          EOF

          # Strings
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">जेड प्लस सिक्योरिटी</string>
          </resources>
          EOF

          # Themes
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.ZPlusSecurity" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:navigationBarColor">#050B14</item>
                  <item name="android:statusBarColor">#050B14</item>
              </style>
          </resources>
          EOF

          # Icon Background
          cat > app/src/main/res/drawable/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#050B14" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#00FF88" android:alpha="0.15" android:pathData="M54,10 L94,26 V58 C94,82 54,98 54,98 C54,98 14,82 14,58 V26 Z"/>
          </vector>
          EOF

          # Icon Foreground
          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#00000000" android:strokeColor="#00FF88" android:strokeWidth="3.5" android:pathData="M54,16 L86,28 V54 C86,74 54,88 54,88 C54,88 22,74 22,54 V28 Z"/>
              <path android:fillColor="#00000000" android:strokeColor="#FFD700" android:strokeWidth="1.5" android:pathData="M54,22 L80,32 V52 C80,68 54,80 54,80 C54,80 28,68 28,52 V32 Z"/>
              <path android:fillColor="#FFD700" android:pathData="M38,38 H70 L46,62 H70 V68 H38 L62,44 H38 Z"/>
              <path android:fillColor="#00FF88" android:pathData="M64,36 H68 V40 H72 V44 H68 V48 H64 V44 H60 V40 H64 Z"/>
          </vector>
          EOF

          # Adaptive Icon Config
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF


      # =========================================================
      # 10 - MAIN LAYOUT XML
      # =========================================================
      - name: 10 - Create Activity Main Layout
        run: |
          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#050B14">

              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="#050B14" />
          </FrameLayout>
          EOF


      # =========================================================
      # 11 - ANDROID MANIFEST (PERMISSIONS)
      # =========================================================
      - name: 11 - Create Android Manifest
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" tools:ignore="QueryAllPackagesPermission" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" tools:ignore="ScopedStorage" />
              <uses-permission android:name="android.permission.REQUEST_DELETE_PACKAGES" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.ZPlusSecurity">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF


      # =========================================================
      # 12 - MAIN ACTIVITY KOTLIN (NEW PERMISSION & POP-UP LOGIC)
      # =========================================================
      - name: 12 - Create MainActivity Kotlin Code
        run: |
          cat > app/src/main/java/com/zplussecurity/app/MainActivity.kt <<'EOF'
          package com.zplussecurity.app

          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.Intent
          import android.content.pm.ApplicationInfo
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.provider.Settings
          import android.speech.tts.TextToSpeech
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.util.Locale

          class MainActivity : AppCompatActivity(), TextToSpeech.OnInitListener {

              private lateinit var webView: WebView
              private var tts: TextToSpeech? = null
              private var isTtsReady = false

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.setFlags(
                      android.view.WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      android.view.WindowManager.LayoutParams.FLAG_FULLSCREEN
                  )
                  setContentView(R.layout.activity_main)

                  tts = TextToSpeech(this, this)
                  webView = findViewById(R.id.webView)
                  
                  setupWebView()
                  requestPermissionsOnStart()
              }

              // 🚀 PERMISSION POP-UP MANAGER 🚀
              private fun requestPermissionsOnStart() {
                  // For Android 11+ (API 30+)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      if (!Environment.isExternalStorageManager()) {
                          Toast.makeText(this, "कृपया Z Plus Security को All Files Access दें ताकि स्कैनिंग हो सके", Toast.LENGTH_LONG).show()
                          try {
                              val intent = Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION)
                              intent.data = Uri.parse("package:$packageName")
                              startActivity(intent)
                          } catch (e: Exception) {
                              val intent = Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION)
                              startActivity(intent)
                          }
                      }
                  } else {
                      // For Below Android 11
                      val writePermission = ContextCompat.checkSelfPermission(this, Manifest.permission.WRITE_EXTERNAL_STORAGE)
                      if (writePermission != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(
                              this,
                              arrayOf(Manifest.permission.READ_EXTERNAL_STORAGE, Manifest.permission.WRITE_EXTERNAL_STORAGE),
                              101
                          )
                      }
                  }
              }

              private fun setupWebView() {
                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      allowFileAccess = true
                      allowContentAccess = true
                      mediaPlaybackRequiresUserGesture = false
                  }
                  webView.webViewClient = WebViewClient()
                  webView.webChromeClient = WebChromeClient()
                  webView.addJavascriptInterface(ZPlusSecurityBridge(), "AndroidSecurity")
                  webView.loadUrl("file:///android_asset/index.html")
              }

              inner class ZPlusSecurityBridge {

                  // 1. Full Offline Deep Scan Engine
                  @JavascriptInterface
                  fun executeFullScan(): String {
                      val threatsArray = JSONArray()
                      try {
                          // A. Scan Hidden Apps
                          val pm = packageManager
                          val packages = pm.getInstalledPackages(0)

                          for (pkg in packages) {
                              val isSystem = (pkg.applicationInfo.flags and ApplicationInfo.FLAG_SYSTEM) != 0
                              val launchIntent = pm.getLaunchIntentForPackage(pkg.packageName)

                              if (!isSystem && launchIntent == null && pkg.packageName != packageName) {
                                  val item = JSONObject().apply {
                                      put("type", "HIDDEN_APP")
                                      put("name", pkg.applicationInfo.loadLabel(pm).toString().ifEmpty { "Suspicious Payload App" })
                                      put("target", pkg.packageName)
                                      put("location", "RAM / Background Package")
                                      put("risk", "High Risk (Hidden Launcher Icon)")
                                  }
                                  threatsArray.put(item)
                              }
                          }

                          // B. Scan Downloads Directory
                          val downloadsDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS)
                          if (downloadsDir != null && downloadsDir.exists()) {
                              downloadsDir.listFiles()?.forEach { file ->
                                  if (file.isFile && (file.name.endsWith(".apk") || file.name.endsWith(".payload") || file.name.endsWith(".tmp"))) {
                                      val item = JSONObject().apply {
                                          put("type", "FILE")
                                          put("name", file.name)
                                          put("target", file.absolutePath)
                                          put("location", file.parent ?: "/sdcard/Download")
                                          put("risk", "Unverified Download Payload")
                                      }
                                      threatsArray.put(item)
                                  }
                              }
                          }
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                      return threatsArray.toString()
                  }

                  // 2. Permanent Single File Deletion
                  @JavascriptInterface
                  fun deleteFileThreat(filePath: String): Boolean {
                      return try {
                          val file = File(filePath)
                          if (file.exists()) file.delete() else false
                      } catch (_: Exception) { false }
                  }

                  // 3. Uninstall Hidden App (Will trigger Android's uninstaller UI pop-up)
                  @JavascriptInterface
                  fun uninstallAppThreat(packageName: String) {
                      runOnUiThread {
                          try {
                              val intent = Intent(Intent.ACTION_UNINSTALL_PACKAGE).apply {
                                  data = Uri.parse("package:$packageName")
                                  putExtra(Intent.EXTRA_RETURN_RESULT, true)
                              }
                              startActivity(intent)
                          } catch (_: Exception) {}
                      }
                  }

                  // 4. Voice Alert
                  @JavascriptInterface
                  fun speakAlert(message: String) {
                      runOnUiThread {
                          if (isTtsReady) tts?.speak(message, TextToSpeech.QUEUE_FLUSH, null, "ZPLUS_SPEECH")
                      }
                  }

                  // 5. Haptic Feedback Engine
                  @JavascriptInterface
                  fun triggerVibration() {
                      runOnUiThread {
                          try {
                              val vibrator = getSystemService(VIBRATOR_SERVICE) as Vibrator
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  vibrator.vibrate(VibrationEffect.createOneShot(50L, VibrationEffect.DEFAULT_AMPLITUDE))
                              } else {
                                  @Suppress("DEPRECATION")
                                  vibrator.vibrate(50L)
                              }
                          } catch (_: Exception) {}
                      }
                  }
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      isTtsReady = true
                      tts?.language = Locale("hi", "IN")
                      tts?.setSpeechRate(0.95f)
                      tts?.setPitch(1.2f)
                  }
              }

              override fun onDestroy() {
                  try {
                      tts?.stop()
                      tts?.shutdown()
                      webView.destroy()
                  } catch (_: Exception) {}
                  super.onDestroy()
              }
          }
          EOF


      # =========================================================
      # 13 - WEBGL THREE.JS 3D HUD & SCANNER INTERFACE
      # =========================================================
      - name: 13 - Create WebGL 3D Scanner UI
        run: |
          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="hi">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
          <title>Z Plus Security 3D</title>
          <style>
              * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
              html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #050b14; font-family: 'Segoe UI', Roboto, sans-serif; }
              #webgl-container { width: 100vw; height: 100vh; position: absolute; inset: 0; z-index: 1; }
              .ui-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
              .header { text-align: center; }
              .brand-title { font-size: 22px; font-weight: 900; letter-spacing: 3px; color: #ffd700; text-shadow: 0 0 15px rgba(255,215,0,0.6); }
              .sub-status { font-size: 11px; letter-spacing: 2px; color: #00ff88; margin-top: 4px; text-transform: uppercase; text-shadow: 0 0 8px rgba(0,255,136,0.6); }
              .action-box { align-self: center; pointer-events: auto; text-align: center; margin-bottom: 20px; }
              .btn-scan { background: linear-gradient(135deg, #00ff88, #008855); border: none; color: #050b14; font-size: 15px; font-weight: 800; padding: 16px 36px; border-radius: 30px; box-shadow: 0 0 25px rgba(0,255,136,0.5); cursor: pointer; letter-spacing: 1.5px; transition: transform 0.2s; }
              .btn-scan:active { transform: scale(0.95); }
              .threat-modal { position: absolute; inset: 0; z-index: 20; background: rgba(5, 11, 20, 0.95); display: none; flex-direction: column; padding: 24px 18px; overflow-y: auto; }
              .threat-modal.active { display: flex; }
              .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,0,85,0.4); padding-bottom: 12px; margin-bottom: 16px; }
              .modal-title { color: #ff0055; font-size: 18px; font-weight: 800; }
              .threat-card { background: rgba(255,0,85,0.08); border: 1px solid rgba(255,0,85,0.3); border-radius: 12px; padding: 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
              .threat-info { max-width: 70%; }
              .threat-name { color: #fff; font-size: 14px; font-weight: 700; word-break: break-all; }
              .threat-loc { color: rgba(255,255,255,0.6); font-size: 11px; margin-top: 4px; word-break: break-all; }
              .threat-risk { color: #ff0055; font-size: 11px; font-weight: 700; margin-top: 2px; }
              .btn-delete-one { background: #ff0055; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 800; cursor: pointer; }
              .btn-delete-all { background: linear-gradient(135deg, #ff0055, #990033); color: #fff; border: none; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: auto; box-shadow: 0 0 20px rgba(255,0,85,0.4); }
          </style>
          <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
          </head>
          <body>
          <div id="webgl-container"></div>
          <div class="ui-layer">
              <div class="header">
                  <div class="brand-title">Z PLUS SECURITY</div>
                  <div class="sub-status" id="statusText">AI HARDWARE SCANNER • OFFLINE CORE</div>
              </div>
              <div class="action-box">
                  <button class="btn-scan" id="scanBtn" onclick="startZPlusScan()">START DEEP SCAN</button>
              </div>
          </div>
          <div class="threat-modal" id="threatModal">
              <div class="modal-header">
                  <div class="modal-title" id="threatCountTitle">DANGER DETECTED (0)</div>
                  <button style="background:none; border:none; color:#fff; font-size:20px;" onclick="closeModal()">✕</button>
              </div>
              <div id="threatListContainer"></div>
              <button class="btn-delete-all" id="btnDeleteAll" onclick="deleteAllThreats()">DELETE ALL PERMANENTLY</button>
          </div>
          <script>
          function callNative(method, arg="") {
              try { if (window.AndroidSecurity && window.AndroidSecurity[method]) return window.AndroidSecurity[method](arg); } catch(e){}
              return "";
          }

          const container = document.getElementById('webgl-container');
          const scene = new THREE.Scene();
          const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
          camera.position.set(0, 0, 7);
          const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
          renderer.setSize(window.innerWidth, window.innerHeight);
          renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
          container.appendChild(renderer.domElement);

          scene.add(new THREE.AmbientLight(0xffffff, 0.5));
          const greenLight = new THREE.PointLight(0x00ff88, 3, 10); greenLight.position.set(2, 3, 3); scene.add(greenLight);
          const goldLight = new THREE.PointLight(0xffd700, 3, 10); goldLight.position.set(-2, -2, 3); scene.add(goldLight);

          const shieldGroup = new THREE.Group();
          const shieldShape = new THREE.Shape();
          shieldShape.moveTo(0, 1.8); shieldShape.lineTo(1.4, 1.0); shieldShape.lineTo(1.4, -0.4); shieldShape.lineTo(0, -1.8); shieldShape.lineTo(-1.4, -0.4); shieldShape.lineTo(-1.4, 1.0); shieldShape.closePath();
          const extrudeSettings = { depth: 0.2, bevelEnabled: true, bevelSegments: 3, steps: 1, bevelSize: 0.05, bevelThickness: 0.05 };
          const shieldGeo = new THREE.ExtrudeGeometry(shieldShape, extrudeSettings);
          const shieldMat = new THREE.MeshStandardMaterial({ color: 0x050b14, roughness: 0.2, metalness: 0.9 });
          shieldGroup.add(new THREE.Mesh(shieldGeo, shieldMat));
          
          const ringGeo = new THREE.TorusGeometry(2.2, 0.03, 16, 100);
          const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ff88, wireframe: true });
          const ringMesh = new THREE.Mesh(ringGeo, ringMat);
          shieldGroup.add(ringMesh);
          scene.add(shieldGroup);

          let isScanning = false;
          let currentThreats = [];

          function animate() {
              requestAnimationFrame(animate);
              shieldGroup.rotation.y += isScanning ? 0.08 : 0.008;
              ringMesh.rotation.z -= 0.01;
              renderer.render(scene, camera);
          }
          animate();

          function startZPlusScan() {
              callNative("triggerVibration");
              callNative("speakAlert", "जेड प्लस सिक्योरिटी स्कैनिंग शुरू हो रही है");
              isScanning = true;
              document.getElementById('statusText').innerText = "SCANNING RAM & STORAGE...";
              document.getElementById('scanBtn').style.opacity = "0.5";

              setTimeout(() => {
                  const resultJson = callNative("executeFullScan");
                  try { currentThreats = JSON.parse(resultJson || "[]"); } catch(e) { currentThreats = []; }
                  isScanning = false;
                  document.getElementById('scanBtn').style.opacity = "1";

                  if (currentThreats.length > 0) {
                      callNative("speakAlert", "सावधान! आपके फोन में " + currentThreats.length + " मालवेयर पाए गए हैं");
                      showThreatModal();
                  } else {
                      document.getElementById('statusText').innerText = "SYSTEM SECURE • NO MALWARE FOUND";
                      callNative("speakAlert", "आपका डिवाइस 100% सुरक्षित है");
                  }
              }, 3000);
          }

          function showThreatModal() {
              const modal = document.getElementById('threatModal');
              const container = document.getElementById('threatListContainer');
              document.getElementById('threatCountTitle').innerText = `DANGER DETECTED (${currentThreats.length})`;
              container.innerHTML = "";
              currentThreats.forEach((item, index) => {
                  const card = document.createElement('div');
                  card.className = "threat-card";
                  card.innerHTML = `
                      <div class="threat-info">
                          <div class="threat-name">${item.name}</div>
                          <div class="threat-loc">${item.location}</div>
                          <div class="threat-risk">${item.risk}</div>
                      </div>
                      <button class="btn-delete-one" onclick="deleteSingleThreat(${index})">DELETE</button>
                  `;
                  container.appendChild(card);
              });
              modal.classList.add('active');
          }

          function closeModal() { document.getElementById('threatModal').classList.remove('active'); }

          function deleteSingleThreat(index) {
              callNative("triggerVibration");
              const threat = currentThreats[index];
              if (threat.type === "FILE") callNative("deleteFileThreat", threat.target);
              else if (threat.type === "HIDDEN_APP") callNative("uninstallAppThreat", threat.target);
              
              currentThreats.splice(index, 1);
              if (currentThreats.length === 0) {
                  closeModal();
                  document.getElementById('statusText').innerText = "ALL THREATS CLEARED • SYSTEM SECURE";
                  callNative("speakAlert", "सभी वायरस सफलतापूर्वक हटा दिए गए हैं");
              } else {
                  showThreatModal();
              }
          }

          function deleteAllThreats() {
              callNative("triggerVibration");
              callNative("speakAlert", "सभी खतरनाक फाइलों को हटाया जा रहा है");
              for (let i = currentThreats.length - 1; i >= 0; i--) {
                  const threat = currentThreats[i];
                  if (threat.type === "FILE") callNative("deleteFileThreat", threat.target);
                  else if (threat.type === "HIDDEN_APP") callNative("uninstallAppThreat", threat.target);
              }
              currentThreats = [];
              closeModal();
              document.getElementById('statusText').innerText = "ALL THREATS CLEARED • SYSTEM SECURE";
          }
          </script>
          </body>
          </html>
          EOF


      # =========================================================
      # 14 - BUILD GRADLE DEBUG APK
      # =========================================================
      - name: 14 - Build APK
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon
          test -f app/build/outputs/apk/debug/app-debug.apk
          echo "Z PLUS SECURITY APK BUILD SUCCESSFUL"


      # =========================================================
      # 15 - RENAME APK DELIVERABLE
      # =========================================================
      - name: 15 - Rename APK
        run: |
          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/debug/Z-Plus-Security.apk


      # =========================================================
      # 16 - UPLOAD APK ARTIFACT
      # =========================================================
      - name: 16 - Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Z-Plus-Security-APK
          path: app/build/outputs/apk/debug/Z-Plus-Security.apk
          if-no-files-found: error
