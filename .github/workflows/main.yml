name: Build Z Plus Security 3D APK (12-Engine AI Edition)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build & Optimize Z Plus Security APK
    runs-on: ubuntu-latest

    steps:
      # =========================================================
      # 01 - CHECKOUT REPOSITORY
      # =========================================================
      - name: 01 - Checkout Repository
        uses: actions/checkout@v4

      # =========================================================
      # 02 - SETUP JAVA 17
      # =========================================================
      - name: 02 - Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # =========================================================
      # 03 - SETUP GRADLE 8.5
      # =========================================================
      - name: 03 - Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      # =========================================================
      # 04 - CLEAN & CREATE DIRECTORY STRUCTURE
      # =========================================================
      - name: 04 - Setup Directory Tree
        run: |
          set -euo pipefail
          rm -rf app .gradle settings.gradle build.gradle gradle.properties
          mkdir -p app/src/main/java/com/zplussecurity/app
          mkdir -p app/src/main/assets/models
          mkdir -p app/src/main/assets/signatures
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/mipmap-anydpi-v26

      # =========================================================
      # 05 - DOWNLOAD AI MODEL & CREATE OFFLINE YARA SIGNATURES
      # =========================================================
      - name: 05 - Download AI Model & Create YARA Signatures
        run: |
          # 1. Download TFLite AI Model
          curl -L -o app/src/main/assets/models/diagnostic_model.tflite "https://raw.githubusercontent.com/tensorflow/tflite-support/master/tensorflow_lite_support/metadata/java/src/test/testdata/vision/mobilenet_v1_1.0_224_quant.tflite"
          
          if [ ! -f "app/src/main/assets/models/diagnostic_model.tflite" ]; then
            echo "Model download failed!"
            exit 1
          fi

          # 2. Create Offline YARA Rules / Virus Signature Database
          cat > app/src/main/assets/signatures/yara_rules.json <<'EOF'
          [
            {
              "rule_name": "Trojan.Android.GenericPayload",
              "type": "HEX_PATTERN",
              "pattern": "6465780a30333500",
              "risk": "Dangerous Injected DEX Executable Payload"
            },
            {
              "rule_name": "Spyware.Keylogger.AccessService",
              "type": "STRING_PATTERN",
              "pattern": "android.accessibilityservice.AccessibilityService",
              "risk": "Stealth Screen Recording / Keylogging Threat"
            },
            {
              "rule_name": "Backdoor.Meterpreter.ReverseShell",
              "type": "STRING_PATTERN",
              "pattern": "com.metasploit.stage",
              "risk": "Remote Control Meterpreter Trojan"
            }
          ]
          EOF

      # =========================================================
      # 06 - GRADLE PROPERTIES & SETTINGS
      # =========================================================
      - name: 06 - Create Gradle Properties & Settings
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.parallel=true
          org.gradle.daemon=false
          EOF
          
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ZPlusSecurity"
          include(":app")
          EOF

      # =========================================================
      # 07 - ROOT BUILD GRADLE
      # =========================================================
      - name: 07 - Create Root Build Gradle
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.2.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          EOF

      # =========================================================
      # 08 - APP BUILD GRADLE
      # =========================================================
      - name: 08 - Create App Build Gradle
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }

          android {
              namespace "com.zplussecurity.app"
              compileSdk 34

              defaultConfig {
                  applicationId "com.zplussecurity.app"
                  minSdk 26
                  targetSdk 34
                  versionCode 3
                  versionName "4.0.0"
              }
              
              androidResources {
                  noCompress 'tflite'
              }

              buildTypes { debug { minifyEnabled false } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation "androidx.core:core-ktx:1.13.1"
              implementation "androidx.appcompat:appcompat:1.7.0"
              implementation "com.google.android.material:material:1.12.0"
              implementation "org.json:json:20240303"
              
              implementation "org.tensorflow:tensorflow-lite:2.14.0"
              implementation "org.tensorflow:tensorflow-lite-support:0.4.4"
          }
          EOF

      # =========================================================
      # 09 - GENERATE BLACK & GOLD APP ICON & MANIFEST RESOURCES
      # =========================================================
      - name: 09 - Generate App Icon & Resources
        run: |
          # 1. Install Pillow to generate PNG Launcher Icons
          python3 -m pip install --quiet pillow

          # 2. Python Script to draw Black & Gold App Logo
          python3 - << 'PYEOF'
          import os
          from PIL import Image, ImageDraw, ImageFont

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
          }

          # Load font
          font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"

          for folder, size in sizes.items():
              target_dir = f"app/src/main/res/{folder}"
              os.makedirs(target_dir, exist_ok=True)

              # Create Black canvas
              img = Image.new('RGBA', (size, size), (5, 5, 5, 255))
              draw = ImageDraw.Draw(img)

              # Draw Gold Outer Ring Border
              border = max(2, int(size * 0.04))
              pad = int(size * 0.04)
              draw.rectangle([pad, pad, size - pad, size - pad], outline=(255, 215, 0, 255), width=border)

              # Center Text: Z+2
              try:
                  f_main = ImageFont.truetype(font_path, int(size * 0.36))
                  f_sub = ImageFont.truetype(font_path, int(size * 0.11))
              except:
                  f_main = ImageFont.load_default()
                  f_sub = ImageFont.load_default()

              # Draw "Z+2"
              txt_main = "Z+2"
              bb1 = draw.textbbox((0, 0), txt_main, font=f_main)
              w1, h1 = bb1[2] - bb1[0], bb1[3] - bb1[1]
              x1 = (size - w1) / 2
              y1 = (size - h1) / 2 - (size * 0.10)
              draw.text((x1, y1), txt_main, fill=(255, 215, 0, 255), font=f_main)

              # Draw "Z+2 SECURITY"
              txt_sub = "Z+2 SECURITY"
              bb2 = draw.textbbox((0, 0), txt_sub, font=f_sub)
              w2, h2 = bb2[2] - bb2[0], bb2[3] - bb2[1]
              x2 = (size - w2) / 2
              y2 = y1 + h1 + (size * 0.06)
              draw.text((x2, y2), txt_sub, fill=(255, 215, 0, 255), font=f_sub)

              img.save(f"{target_dir}/ic_launcher.png")
              img.save(f"{target_dir}/ic_launcher_round.png")

          print("App Icons generated successfully!")
          PYEOF

          # 3. Create Adaptive Icon XMLs for Android 8.0+
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#050505</color>
          </resources>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <!-- Outer Gold Border Frame -->
              <path
                  android:strokeColor="#FFD700"
                  android:strokeWidth="2"
                  android:pathData="M18,18 L90,18 L90,90 L18,90 Z" />
              <!-- Inner Gold Emblem -->
              <path
                  android:fillColor="#FFD700"
                  android:pathData="M35,38 L55,38 L40,55 L55,55 L55,60 L33,60 L48,43 L35,43 Z" />
              <path
                  android:fillColor="#FFD700"
                  android:pathData="M58,47 L64,47 L64,41 L68,41 L68,47 L74,47 L74,51 L68,51 L68,57 L64,57 L64,51 L58,51 Z" />
              <path
                  android:fillColor="#FFD700"
                  android:pathData="M76,38 L84,38 C87,38 88,40 88,43 C88,47 85,49 82,49 L88,60 L83,60 L78,50 L76,50 L76,60 L72,60 L72,38 Z" />
          </vector>
          EOF

          # 4. Strings & Themes with App Name: Z प्लस टू सिक्योरिटी
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Z प्लस टू सिक्योरिटी</string>
          </resources>
          EOF
          
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?><resources><style name="Theme.ZPlusSecurity" parent="Theme.AppCompat.DayNight.NoActionBar"><item name="android:windowFullscreen">true</item></style></resources>
          EOF
          
          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?><FrameLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent"><WebView android:id="@+id/webView" android:layout_width="match_parent" android:layout_height="match_parent" /></FrameLayout>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" tools:ignore="QueryAllPackagesPermission" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" tools:ignore="ScopedStorage" />
              <uses-permission android:name="android.permission.REQUEST_DELETE_PACKAGES" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.KILL_BACKGROUND_PROCESSES" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />

              <application
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.ZPlusSecurity">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      # =========================================================
      # 10 - MAIN ACTIVITY KOTLIN (12-ENGINE AI ARCHITECTURE)
      # =========================================================
      - name: 10 - Create MainActivity Code
        run: |
          cat > app/src/main/java/com/zplussecurity/app/MainActivity.kt <<'EOF'
          package com.zplussecurity.app

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.ActivityManager
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ApplicationInfo
          import android.content.pm.PackageManager
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.provider.Settings
          import android.speech.tts.TextToSpeech
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import org.json.JSONArray
          import org.json.JSONObject
          import org.tensorflow.lite.Interpreter
          import java.io.File
          import java.io.FileInputStream
          import java.nio.MappedByteBuffer
          import java.nio.channels.FileChannel
          import java.util.Locale

          class MainActivity : AppCompatActivity(), TextToSpeech.OnInitListener {

              private lateinit var webView: WebView
              private var tts: TextToSpeech? = null
              private var isTtsReady = false
              private var tfliteInterpreter: Interpreter? = null
              private var yaraRules = JSONArray()

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  tts = TextToSpeech(this, this)
                  webView = findViewById(R.id.webView)
                  
                  setupTFLite()
                  loadYaraSignatures()
                  setupWebView()
                  requestStoragePermission()
              }

              private fun setupTFLite() {
                  try {
                      val fileDescriptor = assets.openFd("models/diagnostic_model.tflite")
                      val inputStream = FileInputStream(fileDescriptor.fileDescriptor)
                      val fileChannel = inputStream.channel
                      val buffer: MappedByteBuffer = fileChannel.map(FileChannel.MapMode.READ_ONLY, fileDescriptor.startOffset, fileDescriptor.declaredLength)
                      tfliteInterpreter = Interpreter(buffer)
                  } catch (e: Exception) { e.printStackTrace() }
              }

              private fun loadYaraSignatures() {
                  try {
                      val jsonString = assets.open("signatures/yara_rules.json").bufferedReader().use { it.readText() }
                      yaraRules = JSONArray(jsonString)
                  } catch (e: Exception) { e.printStackTrace() }
              }

              private fun requestStoragePermission() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      if (!Environment.isExternalStorageManager()) {
                          try {
                              val intent = Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION)
                              intent.data = Uri.parse("package:$packageName")
                              startActivity(intent)
                          } catch (e: Exception) {
                              startActivity(Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION))
                          }
                      }
                  } else {
                      val writePermission = ContextCompat.checkSelfPermission(this, Manifest.permission.WRITE_EXTERNAL_STORAGE)
                      if (writePermission != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.READ_EXTERNAL_STORAGE, Manifest.permission.WRITE_EXTERNAL_STORAGE), 101)
                      }
                  }
              }

              private fun setupWebView() {
                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      allowFileAccess = true
                      allowContentAccess = true
                  }
                  webView.webViewClient = WebViewClient()
                  webView.webChromeClient = WebChromeClient()
                  webView.addJavascriptInterface(ZPlusSecurityBridge(), "AndroidSecurity")
                  webView.loadUrl("file:///android_asset/index.html")
              }

              inner class ZPlusSecurityBridge {

                  @JavascriptInterface
                  fun runDoctorScan(): String {
                      val threatsArray = JSONArray()
                      try {
                          // ====================================================
                          // ENGINE 1: ClamAV / YARA Offline Byte Signature Engine
                          // ====================================================
                          val downloadDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS)
                          if (downloadDir.exists() && downloadDir.isDirectory) {
                              downloadDir.listFiles()?.forEach { file ->
                                  if (file.isFile) {
                                      val isVirus = scanFileWithYara(file)
                                      if (isVirus != null) {
                                          val virusItem = JSONObject().apply {
                                              put("type", "FILE")
                                              put("name", file.name)
                                              put("target", file.absolutePath)
                                              put("location", "ClamAV/YARA Engine Match")
                                              put("risk", isVirus)
                                          }
                                          threatsArray.put(virusItem)
                                      } else if (file.name.endsWith(".apk", ignoreCase = true)) {
                                          // ENGINE 5: APK Static Bytecode & Heuristic AI Analyzer
                                          val apkRisk = analyzeApkHeuristics(file)
                                          val apkItem = JSONObject().apply {
                                              put("type", "FILE")
                                              put("name", file.name)
                                              put("target", file.absolutePath)
                                              put("location", "APK Heuristic AI Engine")
                                              put("risk", apkRisk)
                                          }
                                          threatsArray.put(apkItem)
                                      }
                                  }
                              }
                          }

                          // ====================================================
                          // ENGINE 2: Device Bio-Data Diagnostics
                          // ====================================================
                          val rootPaths = arrayOf("/system/app/Superuser.apk", "/system/xbin/su", "/system/bin/su", "/sbin/su")
                          for (path in rootPaths) {
                              if (File(path).exists()) {
                                  val rootItem = JSONObject().apply {
                                      put("type", "SYSTEM_INFO")
                                      put("name", "Root Access Artifact Detected")
                                      put("target", "NONE")
                                      put("location", path)
                                      put("risk", "High System Compromise Vulnerability")
                                  }
                                  threatsArray.put(rootItem)
                                  break
                              }
                          }

                          val actManager = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                          val memInfo = ActivityManager.MemoryInfo()
                          actManager.getMemoryInfo(memInfo)
                          val percentUsed = ((memInfo.totalMem - memInfo.availMem).toFloat() / memInfo.totalMem) * 100
                          if (percentUsed > 75) {
                              val ramItem = JSONObject().apply {
                                  put("type", "SYSTEM_RAM")
                                  put("name", "High RAM Stress (${percentUsed.toInt()}%)")
                                  put("target", "RAM_CLEAN")
                                  put("location", "System Memory")
                                  put("risk", "Background Execution Lag")
                              }
                              threatsArray.put(ramItem)
                          }

                          // ====================================================
                          // ENGINE 3: Stealth App Detector
                          // ====================================================
                          val pm = packageManager
                          val packages = pm.getInstalledPackages(PackageManager.GET_PERMISSIONS)
                          for (pkg in packages) {
                              val isSystem = (pkg.applicationInfo.flags and ApplicationInfo.FLAG_SYSTEM) != 0
                              val launchIntent = pm.getLaunchIntentForPackage(pkg.packageName)
                              val appLabel = pkg.applicationInfo.loadLabel(pm).toString().trim()

                              if (!isSystem && (launchIntent == null || appLabel.isEmpty()) && pkg.packageName != packageName) {
                                  val item = JSONObject().apply {
                                      put("type", "HIDDEN_APP")
                                      put("name", if (appLabel.isEmpty()) "Stealth Malicious Payload" else appLabel)
                                      put("target", pkg.packageName)
                                      put("location", "Hidden Background Package")
                                      put("risk", "No Icon / Stealth Spyware Threat")
                                  }
                                  threatsArray.put(item)
                              }

                              // ENGINE 4: AI Behavioral Anomaly Detection
                              if (!isSystem && pkg.packageName != packageName) {
                                  val isBehaviorAnomaly = checkBehavioralAnomaly(pkg)
                                  if (isBehaviorAnomaly != null) {
                                      val anomalyItem = JSONObject().apply {
                                          put("type", "HIDDEN_APP")
                                          put("name", appLabel)
                                          put("target", pkg.packageName)
                                          put("location", "AI Behavioral Anomaly Guard")
                                          put("risk", isBehaviorAnomaly)
                                      }
                                      threatsArray.put(anomalyItem)
                                  }
                              }
                          }

                          // ====================================================
                          // ENGINE 6: AI Phishing & Malicious URL Scanner
                          // ====================================================
                          val phishingThreat = scanClipboardAndFilesForPhishing()
                          if (phishingThreat != null) threatsArray.put(phishingThreat)

                          // ====================================================
                          // ENGINE 7: Zero-Day Ransomware & Mass Encryption Guard
                          // ====================================================
                          val ransomwareThreat = scanStorageForRansomwarePatterns()
                          if (ransomwareThreat != null) threatsArray.put(ransomwareThreat)

                          // ====================================================
                          // ENGINE 8: Network Traffic & C2 Server Detector
                          // ====================================================
                          val networkThreat = auditNetworkAndC2Sockets()
                          if (networkThreat != null) threatsArray.put(networkThreat)

                          // ====================================================
                          // ENGINE 9: Keylogger & Accessibility Abuse Monitor
                          // ====================================================
                          val keyloggerThreat = auditKeyloggersAndAccessibility()
                          if (keyloggerThreat != null) threatsArray.put(keyloggerThreat)

                          // ====================================================
                          // ENGINE 10: Stealth Camera & Mic Snooping Guard
                          // ====================================================
                          val snoopingThreat = auditCameraMicSnooping()
                          if (snoopingThreat != null) threatsArray.put(snoopingThreat)

                          // ====================================================
                          // ENGINE 11: Fake Banking & Screen Overlay Malware Guard
                          // ====================================================
                          val bankingThreat = auditBankingOverlayThreats()
                          if (bankingThreat != null) threatsArray.put(bankingThreat)

                          // ====================================================
                          // ENGINE 12: Wi-Fi Security & DNS Spoofing Guard
                          // ====================================================
                          val wifiThreat = auditWifiAndDnsSecurity()
                          if (wifiThreat != null) threatsArray.put(wifiThreat)

                      } catch (e: Exception) { e.printStackTrace() }
                      return threatsArray.toString()
                  }

                  private fun scanFileWithYara(file: File): String? {
                      try {
                          if (file.length() > 10 * 1024 * 1024) return null
                          val bytes = file.readBytes()
                          val fileContentStr = String(bytes)

                          for (i in 0 until yaraRules.length()) {
                              val rule = yaraRules.getJSONObject(i)
                              val pattern = rule.getString("pattern")
                              val type = rule.getString("type")

                              if (type == "STRING_PATTERN" && fileContentStr.contains(pattern)) {
                                  return rule.getString("risk")
                              }
                          }
                      } catch (e: Exception) {}
                      return null
                  }

                  private fun checkBehavioralAnomaly(pkg: android.content.pm.PackageInfo): String? {
                      if (pkg.requestedPermissions == null) return null
                      var hasAccessibility = false
                      var hasOverlay = false
                      var hasSms = false

                      for (perm in pkg.requestedPermissions) {
                          if (perm == "android.permission.BIND_ACCESSIBILITY_SERVICE") hasAccessibility = true
                          if (perm == "android.permission.SYSTEM_ALERT_WINDOW") hasOverlay = true
                          if (perm == "android.permission.RECEIVE_SMS" || perm == "android.permission.READ_SMS") hasSms = true
                      }

                      if (hasAccessibility && hasOverlay) return "High Behavioral Threat: Screen Snooping & Keylogging Overlay"
                      if (hasSms && hasOverlay) return "Banking Fraud Anomaly: Silent SMS Interception with Overlay"
                      return null
                  }

                  private fun analyzeApkHeuristics(apkFile: File): String {
                      val fileSizeMb = apkFile.length() / (1024 * 1024)
                      if (fileSizeMb < 1) return "Suspicious Low Weight Executable Package (<1MB)"
                      return "Untrusted External Package Threat"
                  }

                  private fun scanClipboardAndFilesForPhishing(): JSONObject? {
                      try {
                          val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          if (clipboard.hasPrimaryClip()) {
                              val clipData = clipboard.primaryClip?.getItemAt(0)?.text?.toString() ?: ""
                              val suspiciousKeywords = arrayOf("login-verify", "bank-update", "claim-reward", ".tk/", "free-recharge", "account-alert")
                              for (kw in suspiciousKeywords) {
                                  if (clipData.contains(kw, ignoreCase = true)) {
                                      return JSONObject().apply {
                                          put("type", "SYSTEM_INFO")
                                          put("name", "Malicious Phishing URL in Clipboard")
                                          put("target", "NONE")
                                          put("location", "AI Phishing Scanner")
                                          put("risk", "High Risk Phishing Link Detected")
                                      }
                                  }
                              }
                          }
                      } catch (e: Exception) {}
                      return null
                  }

                  private fun scanStorageForRansomwarePatterns(): JSONObject? {
                      try {
                          val downloadDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS)
                          val ransomwareExts = arrayOf(".locked", ".crypto", ".enc", ".ransom", ".crypted", ".wcry")
                          downloadDir.listFiles()?.forEach { file ->
                              for (ext in ransomwareExts) {
                                  if (file.name.endsWith(ext, ignoreCase = true)) {
                                      return JSONObject().apply {
                                          put("type", "FILE")
                                          put("name", file.name)
                                          put("target", file.absolutePath)
                                          put("location", "Zero-Day Ransomware Guard")
                                          put("risk", "Ransomware Encryption Pattern Match")
                                      }
                                  }
                              }
                          }
                      } catch (e: Exception) {}
                      return null
                  }

                  private fun auditNetworkAndC2Sockets(): JSONObject? {
                      try {
                          val cm = getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                          val activeNet = cm.activeNetworkInfo
                          if (activeNet != null && activeNet.isConnected) {
                              val proxyHost = System.getProperty("http.proxyHost")
                              if (!proxyHost.isNullOrEmpty()) {
                                  return JSONObject().apply {
                                      put("type", "SYSTEM_INFO")
                                      put("name", "Active HTTP Network Proxy Hook")
                                      put("target", "NONE")
                                      put("location", "Network C2 Detector")
                                      put("risk", "Traffic Interception Vulnerability")
                                  }
                              }
                          }
                      } catch (e: Exception) {}
                      return null
                  }

                  private fun auditKeyloggersAndAccessibility(): JSONObject? {
                      try {
                          val enabledServices = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES)
                          if (!enabledServices.isNullOrEmpty()) {
                              val servicesList = enabledServices.split(":")
                              for (service in servicesList) {
                                  if (!service.contains(packageName) && !service.contains("android") && !service.contains("google")) {
                                      return JSONObject().apply {
                                          put("type", "SYSTEM_INFO")
                                          put("name", "Active Untrusted Accessibility Binding")
                                          put("target", service)
                                          put("location", "Keylogger & Accessibility Guard")
                                          put("risk", "Potential Keylogger / Input Interception Risk")
                                      }
                                  }
                              }
                          }
                      } catch (e: Exception) {}
                      return null
                  }

                  private fun auditCameraMicSnooping(): JSONObject? {
                      try {
                          val pm = packageManager
                          val packages = pm.getInstalledPackages(PackageManager.GET_PERMISSIONS)
                          for (pkg in packages) {
                              val isSystem = (pkg.applicationInfo.flags and ApplicationInfo.FLAG_SYSTEM) != 0
                              if (!isSystem && pkg.packageName != packageName && pkg.requestedPermissions != null) {
                                  var hasCamera = false
                                  var hasAudio = false
                                  var hasOverlay = false
                                  for (perm in pkg.requestedPermissions) {
                                      if (perm == Manifest.permission.CAMERA) hasCamera = true
                                      if (perm == Manifest.permission.RECORD_AUDIO) hasAudio = true
                                      if (perm == Manifest.permission.SYSTEM_ALERT_WINDOW) hasOverlay = true
                                  }
                                  if ((hasCamera || hasAudio) && hasOverlay) {
                                      val appLabel = pkg.applicationInfo.loadLabel(pm).toString().trim()
                                      return JSONObject().apply {
                                          put("type", "HIDDEN_APP")
                                          put("name", if (appLabel.isEmpty()) pkg.packageName else appLabel)
                                          put("target", pkg.packageName)
                                          put("location", "Stealth Cam/Mic Guard")
                                          put("risk", "Background Screen/Audio Recording & Overlay Abuse")
                                      }
                                  }
                              }
                          }
                      } catch (e: Exception) {}
                      return null
                  }

                  private fun auditBankingOverlayThreats(): JSONObject? {
                      try {
                          val pm = packageManager
                          val packages = pm.getInstalledPackages(PackageManager.GET_PERMISSIONS)
                          for (pkg in packages) {
                              val isSystem = (pkg.applicationInfo.flags and ApplicationInfo.FLAG_SYSTEM) != 0
                              val pName = pkg.packageName.lowercase(Locale.ROOT)
                              val isBankTarget = pName.contains("bank") || pName.contains("pay") || pName.contains("upi") || pName.contains("wallet")
                              if (!isSystem && !isBankTarget && pkg.packageName != packageName && pkg.requestedPermissions != null) {
                                  var hasOverlay = false
                                  var hasAccessibility = false
                                  for (perm in pkg.requestedPermissions) {
                                      if (perm == Manifest.permission.SYSTEM_ALERT_WINDOW) hasOverlay = true
                                      if (perm == "android.permission.BIND_ACCESSIBILITY_SERVICE") hasAccessibility = true
                                  }
                                  if (hasOverlay && hasAccessibility) {
                                      val appLabel = pkg.applicationInfo.loadLabel(pm).toString().trim()
                                      return JSONObject().apply {
                                          put("type", "HIDDEN_APP")
                                          put("name", if (appLabel.isEmpty()) pkg.packageName else appLabel)
                                          put("target", pkg.packageName)
                                          put("location", "Fake Banking Overlay Guard")
                                          put("risk", "High Risk: Banking Screen Overlay & Credential Theft")
                                      }
                                  }
                              }
                          }
                      } catch (e: Exception) {}
                      return null
                  }

                  private fun auditWifiAndDnsSecurity(): JSONObject? {
                      try {
                          val cm = getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              val activeNet = cm.activeNetwork
                              val caps = cm.getNetworkCapabilities(activeNet)
                              if (caps != null && caps.hasTransport(NetworkCapabilities.TRANSPORT_WIFI)) {
                                  if (!caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_VALIDATED)) {
                                      return JSONObject().apply {
                                          put("type", "SYSTEM_INFO")
                                          put("name", "Unvalidated / Unsecured Wi-Fi Connection")
                                          put("target", "NONE")
                                          put("location", "Wi-Fi & DNS Guard")
                                          put("risk", "Captive Portal / DNS Hijacking Vulnerability")
                                      }
                                  }
                              }
                          }
                      } catch (e: Exception) {}
                      return null
                  }

                  @JavascriptInterface
                  fun deleteFileThreat(filePath: String): Boolean {
                      return try {
                          val file = File(filePath)
                          if (file.exists()) file.delete() else false
                      } catch (e: Exception) { false }
                  }

                  @JavascriptInterface
                  fun fixSystemIssue(target: String): Boolean {
                      return try {
                          if (target == "RAM_CLEAN") {
                              val actManager = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                              val packages = packageManager.getInstalledPackages(0)
                              for (pkg in packages) {
                                  if ((pkg.applicationInfo.flags and ApplicationInfo.FLAG_SYSTEM) == 0 && pkg.packageName != packageName) {
                                      actManager.killBackgroundProcesses(pkg.packageName)
                                  }
                              }
                              true
                          } else false
                      } catch (e: Exception) { false }
                  }

                  @JavascriptInterface
                  fun uninstallAppThreat(pkgName: String) = runOnUiThread {
                      try { startActivity(Intent(Intent.ACTION_UNINSTALL_PACKAGE).apply { data = Uri.parse("package:$pkgName") }) } catch (e: Exception) {}
                  }

                  @JavascriptInterface
                  fun speakAlert(message: String) = runOnUiThread { if (isTtsReady) tts?.speak(message, TextToSpeech.QUEUE_FLUSH, null, "ZPLUS") }

                  @JavascriptInterface
                  fun triggerVibration() = runOnUiThread {
                      try {
                          val vibrator = getSystemService(VIBRATOR_SERVICE) as Vibrator
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) vibrator.vibrate(VibrationEffect.createOneShot(50L, VibrationEffect.DEFAULT_AMPLITUDE)) else vibrator.vibrate(50L)
                      } catch (e: Exception) {}
                  }
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      isTtsReady = true
                      tts?.language = Locale("hi", "IN")
                  }
              }
              override fun onDestroy() { tts?.stop(); tts?.shutdown(); super.onDestroy() }
          }
          EOF

      # =========================================================
      # 11 - CREATE WEBGL 3D INTERFACE (12-ENGINE DASHBOARD)
      # =========================================================
      - name: 11 - Create WebGL UI
        run: |
          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="hi">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
          <title>Z प्लस टू सिक्योरिटी</title>
          <style>
              * { box-sizing: border-box; user-select: none; }
              html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; background: #030712; font-family: sans-serif; overflow: hidden; }
              #webgl-container { position: absolute; inset: 0; z-index: 1; }
              .ui-layer { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; pointer-events: none; }
              .brand-title { text-align: center; font-size: 22px; font-weight: 900; color: #ffd700; text-shadow: 0 0 15px rgba(255,215,0,0.6); margin-top: 15px; }
              .sub-status { text-align: center; color: #00ff88; font-size: 11px; font-weight: bold; margin-top: 4px; }
              .engine-badges { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; margin-top: 8px; max-width: 95%; margin-left: auto; margin-right: auto; }
              .badge { background: rgba(0,255,136,0.12); border: 1px solid #00ff88; color: #00ff88; font-size: 7.5px; padding: 2px 5px; border-radius: 8px; font-weight: bold; }
              .action-box { align-self: center; pointer-events: auto; margin-bottom: 25px; }
              .btn-scan { background: linear-gradient(135deg, #ffd700, #b8860b); color: #000; border: none; padding: 16px 35px; border-radius: 30px; font-size: 15px; font-weight: 900; box-shadow: 0 0 25px rgba(255,215,0,0.6); cursor: pointer; }
              .modal { position: absolute; inset: 0; z-index: 20; background: rgba(3,7,18,0.96); display: none; flex-direction: column; padding: 20px; overflow-y: auto; }
              .modal.active { display: flex; }
              .modal-header { font-size: 18px; color: #ff0055; font-weight: bold; border-bottom: 1px solid #ff0055; padding-bottom: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; }
              .card { background: rgba(255,0,85,0.1); border: 1px solid rgba(255,0,85,0.4); border-radius: 10px; padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
              .card-title { color: #fff; font-weight: bold; font-size: 13px; }
              .card-desc { color: #aaa; font-size: 10px; margin-top: 3px; }
              .card-risk { color: #ff0055; font-size: 10px; font-weight: bold; margin-top: 3px; }
              .btn-fix { background: #ff0055; color: #fff; padding: 7px 12px; border: none; border-radius: 5px; font-weight: bold; pointer-events: auto; }
              .btn-fix-all { background: linear-gradient(135deg, #ff0055, #990033); color: #fff; padding: 14px; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; margin-top: auto; pointer-events: auto; }
          </style>
          <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
          </head>
          <body>
          <div id="webgl-container"></div>
          <div class="ui-layer">
              <div>
                  <div class="brand-title">Z प्लस टू सिक्योरिटी</div>
                  <div class="sub-status" id="statusText">12 ULTRA AI ENGINES READY</div>
                  <div class="engine-badges">
                      <span class="badge">YARA / CLAMAV</span>
                      <span class="badge">SYSTEM BIO-DATA</span>
                      <span class="badge">STEALTH APP</span>
                      <span class="badge">BEHAVIORAL AI</span>
                      <span class="badge">APK HEURISTIC</span>
                      <span class="badge">PHISHING AI</span>
                      <span class="badge">RANSOMWARE GUARD</span>
                      <span class="badge">NETWORK C2</span>
                      <span class="badge">KEYLOGGER GUARD</span>
                      <span class="badge">SNOOPING GUARD</span>
                      <span class="badge">OVERLAY BANK GUARD</span>
                      <span class="badge">WIFI DNS GUARD</span>
                  </div>
              </div>
              <div class="action-box">
                  <button class="btn-scan" id="scanBtn" onclick="startScan()">12-ENGINE ULTRA SCAN</button>
              </div>
          </div>
          
          <div class="modal" id="resultModal">
              <div class="modal-header">
                  <span id="issueCount">DIAGNOSIS REPORT</span>
                  <span onclick="closeModal()" style="color:#fff; cursor:pointer;">✕</span>
              </div>
              <div id="listContainer"></div>
              <button class="btn-fix-all" onclick="fixAll()">RESOLVE ALL THREATS</button>
          </div>

          <script>
          function nativeCall(method, arg="") {
              try { if (window.AndroidSecurity && window.AndroidSecurity[method]) return window.AndroidSecurity[method](arg); } catch(e){} return "";
          }

          const scene = new THREE.Scene();
          const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100); camera.position.z = 7;
          const renderer = new THREE.WebGLRenderer({alpha: true}); renderer.setSize(window.innerWidth, window.innerHeight);
          document.getElementById('webgl-container').appendChild(renderer.domElement);
          
          const shieldGeo = new THREE.CylinderGeometry(1.5, 1.5, 0.2, 8);
          const shieldMat = new THREE.MeshBasicMaterial({color: 0xffd700, wireframe: true});
          const shield = new THREE.Mesh(shieldGeo, shieldMat);
          shield.rotation.x = Math.PI / 2;
          scene.add(shield);

          let isScanning = false;
          let issues = [];

          function animate() {
              requestAnimationFrame(animate);
              shield.rotation.y += isScanning ? 0.12 : 0.005;
              renderer.render(scene, camera);
          } animate();

          function startScan() {
              nativeCall("triggerVibration");
              nativeCall("speakAlert", "12-एआई इंजन्स के साथ डीप स्कैनिंग शुरू हो रही है");
              isScanning = true;
              document.getElementById('statusText').innerText = "SCANNING ALL 12 ADVANCED AI ENGINES...";

              setTimeout(() => {
                  const resultStr = nativeCall("runDoctorScan");
                  try { issues = JSON.parse(resultStr || "[]"); } catch(e){ issues = []; }
                  isScanning = false;

                  if (issues.length > 0) {
                      nativeCall("speakAlert", "स्कैन में " + issues.length + " सुरक्षा खतरे पाए गए हैं");
                      showModal();
                  } else {
                      document.getElementById('statusText').innerText = "100% SECURE - ALL 12 ENGINES CLEAN";
                      nativeCall("speakAlert", "कोई खतरा नहीं मिला, आपका डिवाइस पूरी तरह से सुरक्षित है");
                  }
              }, 3000);
          }

          function showModal() {
              document.getElementById('resultModal').classList.add('active');
              document.getElementById('issueCount').innerText = `SECURITY THREATS (${issues.length})`;
              const container = document.getElementById('listContainer');
              container.innerHTML = "";
              
              issues.forEach((item, i) => {
                  container.innerHTML += `
                      <div class="card">
                          <div>
                              <div class="card-title">${item.name}</div>
                              <div class="card-desc">${item.location}</div>
                              <div class="card-risk">${item.risk}</div>
                          </div>
                          <button class="btn-fix" onclick="fixSingle(${i})">FIX</button>
                      </div>
                  `;
              });
          }

          function closeModal() { document.getElementById('resultModal').classList.remove('active'); }

          function fixSingle(index) {
              nativeCall("triggerVibration");
              const item = issues[index];
              if(item.type === "FILE") nativeCall("deleteFileThreat", item.target);
              else if(item.type === "HIDDEN_APP") nativeCall("uninstallAppThreat", item.target);
              else if(item.type === "SYSTEM_RAM") nativeCall("fixSystemIssue", item.target);
              
              issues.splice(index, 1);
              if(issues.length === 0) { closeModal(); document.getElementById('statusText').innerText = "ALL THREATS CLEARED"; nativeCall("speakAlert", "सभी सुरक्षा खतरे हटा दिए गए हैं"); }
              else { showModal(); }
          }

          function fixAll() {
              nativeCall("triggerVibration");
              nativeCall("speakAlert", "सभी खतरों का निवारण किया जा रहा है");
              issues.forEach(item => {
                  if(item.type === "FILE") nativeCall("deleteFileThreat", item.target);
                  else if(item.type === "HIDDEN_APP") nativeCall("uninstallAppThreat", item.target);
                  else if(item.type === "SYSTEM_RAM") nativeCall("fixSystemIssue", item.target);
              });
              issues = [];
              closeModal();
              document.getElementById('statusText').innerText = "SYSTEM SECURED & CLEAN";
          }
          </script>
          </body>
          </html>
          EOF

      # =========================================================
