name: Build Zeeshan CPU Engine APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Zeeshan CPU Engine Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      # =========================================================================
      # STEP 1: Directory Structure & Basic Setup
      # =========================================================================
      - name: Setup Project Structure & Configurations
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/zeeshan/cpuengine
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/layout

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.daemon=false
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ZeeshanCpuEngine"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.2.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }
          android {
              namespace "com.zeeshan.cpuengine"
              compileSdk 34
              defaultConfig {
                  applicationId "com.zeeshan.cpuengine"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.ZEESHAN-CPU"
              }
              buildTypes { 
                  debug {
                      minifyEnabled false
                  }
                  release { 
                      minifyEnabled false 
                  } 
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation "androidx.core:core-ktx:1.13.1"
              implementation "androidx.appcompat:appcompat:1.7.0"
              implementation "com.google.android.material:material:1.12.0"
          }
          EOF

      # =========================================================================
      # STEP 2: App Icon Generation (Vector Graphics)
      # =========================================================================
      - name: Create Vector Icon Matching CPU Design
        run: |
          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <rect android:x="0" android:y="0" android:width="108" android:height="108" android:fillColor="#0A1118"/>
              <!-- Outer Metal -->
              <rect android:x="18" android:y="18" android:width="72" android:height="72" android:rx="8" android:fillColor="#B0B5BA"/>
              <!-- Inner Heat Spreader -->
              <rect android:x="26" android:y="26" android:width="56" android:height="56" android:rx="6" android:fillColor="#D8DEE4"/>
              <!-- Glowing Eyes -->
              <circle android:cx="42" android:cy="50" android:r="10" android:fillColor="#00E5FF"/>
              <circle android:cx="66" android:cy="50" android:r="10" android:fillColor="#00E5FF"/>
              <circle android:cx="42" android:cy="50" android:r="5" android:fillColor="#FFFFFF"/>
              <circle android:cx="66" android:cy="50" android:r="5" android:fillColor="#FFFFFF"/>
          </vector>
          EOF

      # =========================================================================
      # STEP 3: Pure Kotlin Engine View (100% Vector Rendering)
      # =========================================================================
      - name: Write High Performance Pure Kotlin Engine View
        run: |
          set -euo pipefail

          cat > app/src/main/java/com/zeeshan/cpuengine/CpuDisplayView.kt <<'EOF'
          package com.zeeshan.cpuengine

          import android.content.Context
          import android.graphics.*
          import android.util.AttributeSet
          import android.view.View

          class CpuDisplayView @JvmOverloads constructor(
              context: Context, attrs: AttributeSet? = null, defStyleAttr: Int = 0
          ) : View(context, attrs, defStyleAttr) {

              private val bgPaint = Paint().apply { color = Color.parseColor("#060A10") }
              private val circuitPaint = Paint().apply {
                  color = Color.parseColor("#152D42")
                  strokeWidth = 5f
                  style = Paint.Style.STROKE
                  isAntiAlias = true
              }
              private val metalFramePaint = Paint().apply {
                  color = Color.parseColor("#7A8288")
                  style = Paint.Style.FILL
                  isAntiAlias = true
              }
              private val heatSpreaderPaint = Paint().apply {
                  color = Color.parseColor("#D5DCB6")
                  style = Paint.Style.FILL
                  isAntiAlias = true
              }
              private val cpuInnerPlatePaint = Paint().apply {
                  color = Color.parseColor("#C4CBCF")
                  style = Paint.Style.FILL
                  isAntiAlias = true
              }
              private val pinPaint = Paint().apply {
                  color = Color.parseColor("#D4AF37")
                  strokeWidth = 7f
                  style = Paint.Style.STROKE
              }
              private val eyeOuterPaint = Paint().apply {
                  color = Color.parseColor("#102535")
                  style = Paint.Style.FILL
                  isAntiAlias = true
              }
              private val eyeGlowPaint = Paint().apply {
                  color = Color.parseColor("#00E5FF")
                  style = Paint.Style.FILL
                  isAntiAlias = true
              }
              private val eyeIrisPaint = Paint().apply {
                  color = Color.parseColor("#0088CC")
                  style = Paint.Style.FILL
                  isAntiAlias = true
              }
              private val eyeHighlightPaint = Paint().apply {
                  color = Color.parseColor("#FFFFFF")
                  style = Paint.Style.FILL
                  isAntiAlias = true
              }
              private val titleTextPaint = Paint().apply {
                  color = Color.parseColor("#1A2530")
                  textSize = 42f
                  typeface = Typeface.create(Typeface.SANS_SERIF, Typeface.BOLD)
                  textAlign = Paint.Align.CENTER
                  isAntiAlias = true
              }
              private val subTextPaint = Paint().apply {
                  color = Color.parseColor("#3A4856")
                  textSize = 24f
                  typeface = Typeface.create(Typeface.MONOSPACE, Typeface.BOLD)
                  textAlign = Paint.Align.CENTER
                  isAntiAlias = true
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val w = width.toFloat()
                  val h = height.toFloat()

                  // 1. PCB Background
                  canvas.drawRect(0f, 0f, w, h, bgPaint)

                  // Circuit Grid Lines
                  val step = 80f
                  for (x in 0..w.toInt() step step.toInt()) {
                      canvas.drawLine(x.toFloat(), 0f, x.toFloat(), h, circuitPaint)
                  }
                  for (y in 0..h.toInt() step step.toInt()) {
                      canvas.drawLine(0f, y.toFloat(), w, y.toFloat(), circuitPaint)
                  }

                  // 2. CPU Dimensions
                  val cpuSize = w.coerceAtMost(h) * 0.78f
                  val left = (w - cpuSize) / 2f
                  val top = (h - cpuSize) / 2f
                  val right = left + cpuSize
                  val bottom = top + cpuSize

                  // 3. Gold Pins
                  val pinsCount = 20
                  for (p in 0..pinsCount) {
                      val pos = cpuSize * (p.toFloat() / pinsCount)
                      canvas.drawLine(left + pos, top - 25f, left + pos, top, pinPaint)
                      canvas.drawLine(left + pos, bottom, left + pos, bottom + 25f, pinPaint)
                      canvas.drawLine(left - 25f, top + pos, left, top + pos, pinPaint)
                      canvas.drawLine(right, top + pos, right + 25f, top + pos, pinPaint)
                  }

                  // 4. Outer Metal Socket
                  canvas.drawRoundRect(left, top, right, bottom, 36f, 36f, metalFramePaint)

                  // 5. Heat Spreader Area
                  val margin = cpuSize * 0.08f
                  canvas.drawRoundRect(left + margin, top + margin, right - margin, bottom - margin, 24f, 24f, heatSpreaderPaint)

                  // 6. Processor Core Face
                  val innerMargin = cpuSize * 0.14f
                  val iLeft = left + innerMargin
                  val iTop = top + innerMargin
                  val iRight = right - innerMargin
                  val iBottom = bottom - innerMargin
                  canvas.drawRoundRect(iLeft, iTop, iRight, iBottom, 18f, 18f, cpuInnerPlatePaint)

                  // 7. Glowing Eyes
                  val centerY = iTop + (iBottom - iTop) * 0.38f
                  val eyeRadius = cpuSize * 0.13f
                  val leftEyeX = iLeft + (iRight - iLeft) * 0.30f
                  val rightEyeX = iLeft + (iRight - iLeft) * 0.70f

                  canvas.drawCircle(leftEyeX, centerY, eyeRadius + 8f, eyeOuterPaint)
                  canvas.drawCircle(rightEyeX, centerY, eyeRadius + 8f, eyeOuterPaint)

                  canvas.drawCircle(leftEyeX, centerY, eyeRadius, eyeGlowPaint)
                  canvas.drawCircle(rightEyeX, centerY, eyeRadius, eyeGlowPaint)

                  canvas.drawCircle(leftEyeX, centerY, eyeRadius * 0.6f, eyeIrisPaint)
                  canvas.drawCircle(rightEyeX, centerY, eyeRadius * 0.6f, eyeIrisPaint)

                  canvas.drawCircle(leftEyeX - 8f, centerY - 8f, eyeRadius * 0.25f, eyeHighlightPaint)
                  canvas.drawCircle(rightEyeX - 8f, centerY - 8f, eyeRadius * 0.25f, eyeHighlightPaint)

                  // 8. Engraved Text
                  val textYStart = iTop + (iBottom - iTop) * 0.68f
                  canvas.drawText("INTELLECTUS", w / 2f, textYStart, titleTextPaint)
                  canvas.drawText("CPU PROFESSOR", w / 2f, textYStart + 45f, subTextPaint)
                  canvas.drawText("SERIAL NO. CP-3A01", w / 2f, textYStart + 80f, subTextPaint)
                  canvas.drawText("AI KNOWLEDGE BASE", w / 2f, textYStart + 115f, subTextPaint)
              }
          }
          EOF

      # =========================================================================
      # STEP 4: Fullscreen Layout & Styles (No Headers/Footers)
      # =========================================================================
      - name: Setup Layout & Styles
        run: |
          set -euo pipefail

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#060A10">

              <com.zeeshan.cpuengine.CpuDisplayView
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />

          </FrameLayout>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">CPU Professor</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.FullScreen" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowActionBar">false</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowContentOverlay">@null</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher_foreground"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.FullScreen">
                  <activity 
                      android:name=".MainActivity" 
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      # =========================================================================
      # STEP 5: Fullscreen Immersive Mode in Kotlin MainActivity
      # =========================================================================
      - name: Write MainActivity Code
        run: |
          cat > app/src/main/java/com/zeeshan/cpuengine/MainActivity.kt <<'EOF'
          package com.zeeshan.cpuengine

          import android.os.Build
          import android.os.Bundle
          import android.view.View
          import android.view.WindowInsets
          import android.view.WindowInsetsController
          import android.view.WindowManager
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  
                  // Hide status bar and navigation completely
                  window.setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN
                  )

                  setContentView(R.layout.activity_main)
                  hideSystemUI()
              }

              private fun hideSystemUI() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      window.insetsController?.let { controller ->
                          controller.hide(WindowInsets.Type.statusBars() or WindowInsets.Type.navigationBars())
                          controller.systemBarsBehavior = WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      }
                  } else {
                      @Suppress("DEPRECATION")
                      window.decorView.systemUiVisibility = (
                          View.SYSTEM_UI_FLAG_FULLSCREEN
                          or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          or View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      )
                  }
              }
          }
          EOF

      # =========================================================================
      # STEP 6: Build & Upload Debug APK
      # =========================================================================
      - name: Build Zeeshan CPU Engine Debug APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload Zeeshan CPU Engine Output APK
        uses: actions/upload-artifact@v4
        with:
          name: Zeeshan-CPU-Engine-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

