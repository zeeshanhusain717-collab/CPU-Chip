name: Build Hyper Realistic 3D Brain AI APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build 3D OpenGL Brain Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # =========================================================================
      # STEP 1: Project Architecture Setup
      # =========================================================================
      - name: Create Android Project Structure
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/zeeshan/brainai
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.daemon=false
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "BrainAiEngine"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.2.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }
          android {
              namespace "com.zeeshan.brainai"
              compileSdk 34
              defaultConfig {
                  applicationId "com.zeeshan.brainai"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "4.0.3D-BRAIN-FIXED"
              }
              buildTypes { 
                  debug { minifyEnabled false }
                  release { minifyEnabled false } 
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation "androidx.core:core-ktx:1.13.1"
              implementation "androidx.appcompat:appcompat:1.7.0"
              implementation "com.google.android.material:material:1.12.0"
          }
          EOF

      # =========================================================================
      # STEP 2: OpenGL 3D Engine & Interactive View (Horizontal Rotation Only)
      # =========================================================================
      - name: Write OpenGL 3D Interactive Renderer
        run: |
          cat > app/src/main/java/com/zeeshan/brainai/BrainOpenGLView.kt <<'EOF'
          package com.zeeshan.brainai

          import android.content.Context
          import android.graphics.*
          import android.os.SystemClock
          import android.util.AttributeSet
          import android.view.GestureDetector
          import android.view.MotionEvent
          import android.view.View
          import kotlin.math.*

          class BrainOpenGLView @JvmOverloads constructor(
              context: Context, attrs: AttributeSet? = null, defStyleAttr: Int = 0
          ) : View(context, attrs, defStyleAttr) {

              var onBrainDoubleTappedListener: (() -> Unit)? = null

              // Paint Engine
              private val bgPaint = Paint().apply { color = Color.parseColor("#060A08") }
              private val copperTrackPaint = Paint().apply {
                  color = Color.parseColor("#4A3525")
                  strokeWidth = 4f
                  style = Paint.Style.STROKE
                  isAntiAlias = true
              }
              private val neonGreenSocketPaint = Paint().apply {
                  color = Color.parseColor("#00FF66")
                  style = Paint.Style.FILL
                  isAntiAlias = true
              }
              private val chipBasePaint = Paint().apply {
                  color = Color.parseColor("#121816")
                  style = Paint.Style.FILL
                  isAntiAlias = true
              }
              private val pinPaint = Paint().apply {
                  color = Color.parseColor("#D4AF37")
                  strokeWidth = 6f
                  style = Paint.Style.STROKE
              }
              private val neuralPaint = Paint().apply {
                  style = Paint.Style.FILL
                  isAntiAlias = true
              }

              // State Mechanics
              private var brainProgress = 0f
              private var isBrainEmerging = false
              private var emergenceStartTime = 0L

              // 3D Touch Rotation (HORIZONTAL ONLY)
              private val rotX = 18f // Fixed Tilt Pitch (No Vertical Movement)
              private var rotY = 0f  // 360 Degree Horizontal Rotation
              private var previousTouchX = 0f

              private class Point3D(val x: Float, val y: Float, val z: Float, val intensity: Float)
              private val brainMesh = ArrayList<Point3D>()

              init {
                  // Generate Dense Organic Brain Mesh (~2500 Neural Nodes)
                  val rnd = java.util.Random(101)
                  for (i in 0 until 2500) {
                      val u = rnd.nextFloat() * 2 * PI.toFloat()
                      val v = rnd.nextFloat() * PI.toFloat()

                      // Organic Fold Simulations matching image
                      val fold = sin(v * 12f) * cos(u * 12f) * 18f
                      
                      var rX = (sin(v) * cos(u)) * (140f + fold) * 1.25f
                      var rY = (cos(v)) * (140f + fold) * 0.85f
                      var rZ = (sin(v) * sin(u)) * (140f + fold) * 1.05f

                      if (abs(rX) < 15f) rX *= 0.3f // Hemisphere divide

                      val intensity = (fold + 18f) / 36f
                      brainMesh.add(Point3D(rX, rY, rZ, intensity))
                  }
              }

              private val gestureDetector = GestureDetector(context, object : GestureDetector.SimpleOnGestureListener() {
                  override fun onDoubleTap(e: MotionEvent): Boolean {
                      if (!isBrainEmerging && brainProgress == 0f) {
                          // First Double Tap on CPU: Start 3D Brain Emergence Animation
                          isBrainEmerging = true
                          emergenceStartTime = SystemClock.uptimeMillis()
                          invalidate()
                          return true
                      } else if (brainProgress > 0.7f) {
                          // Double Tap on Formed Brain: Trigger Speech AI
                          onBrainDoubleTappedListener?.invoke()
                          return true
                      }
                      return super.onDoubleTap(e)
                  }
              })

              override fun onTouchEvent(event: MotionEvent): Boolean {
                  gestureDetector.onTouchEvent(event)

                  if (brainProgress > 0.4f) {
                      val x = event.x

                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              previousTouchX = x
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = x - previousTouchX

                              // ROTATE HORIZONTALLY ONLY (Left / Right 360°)
                              rotY += dx * 0.7f

                              previousTouchX = x
                              invalidate()
                          }
                      }
                  }
                  return true
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val w = width.toFloat()
                  val h = height.toFloat()

                  // 1. Dark Cyberpunk PCB Background
                  canvas.drawRect(0f, 0f, w, h, bgPaint)

                  // 2. Copper PCB Tracks & Green Neon Lighting
                  val step = 100f
                  for (i in 0..12) {
                      val pX = (i * step) % w
                      canvas.drawLine(pX, 0f, pX + 40f, h, copperTrackPaint)
                  }

                  // 3. Clean Metallic CPU Chip Socket (NO TEXT)
                  val cpuSize = w.coerceAtMost(h) * 0.68f
                  val cx = w / 2f
                  val cy = h / 2f + 50f
                  val left = cx - cpuSize / 2f
                  val top = cy - cpuSize / 2f
                  val right = cx + cpuSize / 2f
                  val bottom = cy + cpuSize / 2f

                  // Glowing Green Internal Socket Base
                  canvas.drawRoundRect(left + 25f, top + 25f, right - 25f, bottom - 25f, 16f, 16f, neonGreenSocketPaint)

                  // Gold Pins
                  for (p in 0..28) {
                      val pos = cpuSize * (p / 28f)
                      canvas.drawLine(left + pos, top - 25f, left + pos, top, pinPaint)
                      canvas.drawLine(left + pos, bottom, left + pos, bottom + 25f, pinPaint)
                  }

                  // Outer Clean Metal Base Plate
                  canvas.drawRoundRect(left, top, right, bottom, 24f, 24f, chipBasePaint)

                  // Handle Emergence Timings (3 to 5 Seconds)
                  if (isBrainEmerging && brainProgress < 1.0f) {
                      val elapsed = (SystemClock.uptimeMillis() - emergenceStartTime) / 4000f
                      brainProgress = elapsed.coerceAtMost(1.0f)
                      invalidate()
                  } else if (brainProgress >= 1.0f) {
                      rotY += 0.25f // Smooth Auto Horizontal Drift
                      invalidate()
                  } else {
                      invalidate()
                  }

                  // 4. Render 3D Fiery Brain (Fixed Vertical Pitch, 360 Horizontal Spin)
                  if (brainProgress > 0f) {
                      val radX = Math.toRadians(rotX.toDouble())
                      val radY = Math.toRadians(rotY.toDouble())
                      val scale = brainProgress

                      brainMesh.forEach { p ->
                          // Fixed Pitch (X-axis) and Dynamic Yaw (Y-axis) Projection
                          val y1 = p.y * cos(radX) - p.z * sin(radX)
                          val z1 = p.y * sin(radX) + p.z * cos(radX)

                          val x2 = p.x * cos(radY) + z1 * sin(radY)
                          val z2 = -p.x * sin(radY) + z1 * cos(radY)

                          val finalX = x2 * scale
                          val finalY = y1 * scale
                          val finalZ = z2 * scale

                          val projection = (finalZ + 400f) / 400f
                          val screenX = cx + finalX
                          val screenY = (cy - 120f * scale) + finalY // Suspended above CPU

                          if (projection > 0.1f) {
                              val pRadius = (projection * 3.8f).coerceAtLeast(1.2f)

                              // Fiery Cyber Neon Orange Color Theme
                              val alpha = (240 * projection * brainProgress).toInt().coerceIn(0, 255)
                              val red = 255
                              val green = (60 + p.intensity * 160).toInt().coerceIn(0, 255)
                              val blue = (p.intensity * 30).toInt().coerceIn(0, 255)

                              neuralPaint.color = Color.argb(alpha, red, green, blue)
                              canvas.drawCircle(screenX, screenY, pRadius, neuralPaint)
                          }
                      }
                  }
              }
          }
          EOF

      # =========================================================================
      # STEP 3: Layout & Manifest Setup
      # =========================================================================
      - name: Setup Layout Files
        run: |
          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#060A08">

              <com.zeeshan.brainai.BrainOpenGLView
                  android:id="@+id/brainOpenGLView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />

          </FrameLayout>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Brain AI 3D Engine</string>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity 
                      android:name=".MainActivity" 
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      # =========================================================================
      # STEP 4: MainActivity with Speech AI Engine Triggered on Double Tap
      # =========================================================================
      - name: Write MainActivity Code
        run: |
          cat > app/src/main/java/com/zeeshan/brainai/MainActivity.kt <<'EOF'
          package com.zeeshan.brainai

          import android.os.Bundle
          import android.speech.tts.TextToSpeech
          import androidx.appcompat.app.AppCompatActivity
          import java.util.Locale

          class MainActivity : AppCompatActivity(), TextToSpeech.OnInitListener {

              private lateinit var tts: TextToSpeech
              private var isTtsReady = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  tts = TextToSpeech(this, this)

                  val glView = findViewById<BrainOpenGLView>(R.id.brainOpenGLView)
                  glView.onBrainDoubleTappedListener = {
                      speakHelpText()
                  }
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      val result = tts.setLanguage(Locale("hi", "IN"))
                      if (result == TextToSpeech.LANG_MISSING_DATA || result == TextToSpeech.LANG_NOT_SUPPORTED) {
                          tts.language = Locale.US
                      }
                      isTtsReady = true
                  }
              }

              private fun speakHelpText() {
                  if (isTtsReady) {
                      tts.speak("मैं आपकी क्या मदद कर सकता हूँ?", TextToSpeech.QUEUE_FLUSH, null, "BrainAI_Voice")
                  }
              }

              override fun onDestroy() {
                  if (::tts.isInitialized) {
                      tts.stop()
                      tts.shutdown()
                  }
                  super.onDestroy()
              }
          }
          EOF

      # =========================================================================
      # STEP 5: Compile & Build Debug APK
      # =========================================================================
      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload Built APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hyper-3D-Brain-AI-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

