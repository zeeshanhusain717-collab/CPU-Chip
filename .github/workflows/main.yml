                      </div>

                  </div>


                  <!-- =================================================
                       BRAIN
                       ================================================= -->

                  <div
                      class="brain"
                      id="brain">

                      <div class="brainFrame">

                          <div class="brainGlow"></div>

                          <svg
                              class="brainSvg"
                              viewBox="0 0 500 400">

                              <defs>

                                  <linearGradient
                                      id="brainGradient"
                                      x1="0%"
                                      y1="0%"
                                      x2="100%"
                                      y2="100%">

                                      <stop
                                          offset="0%"
                                          stop-color="#ff4b00" />

