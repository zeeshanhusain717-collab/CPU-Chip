              <div
                  class="message"
                  id="message">

                  नमस्ते। मैं आपकी मदद के लिए तैयार हूँ।
                  आप क्या करना चाहते हैं?

              </div>

              <div
                  class="hint"
                  id="hint">

                  CPU पर Double Tap करें

              </div>

          </div>


          <script>

          const cpu =
              document.getElementById(
                  "cpu"
              );

          const brain =
              document.getElementById(
                  "brain"
              );

          const brainReveal =
              document.getElementById(
                  "brainReveal"
              );

          const progress =
              document.querySelector(
                  "#brainProgress span"
              );

          const status =
              document.getElementById(
                  "status"
              );

          const message =
              document.getElementById(
                  "message"
              );

          const hint =
              document.getElementById(
                  "hint"
              );


          let brainOnline = false;

          let revealing = false;

          let rotation = 0;

          let dragging = false;

          let startX = 0;

          let startRotation = 0;

          let moved = false;

          let lastTap = 0;

          let spoken = false;


          function androidCall(
              name,
              value = ""
          ) {

              try {

                  if (
                      window.Android &&
                      typeof
                      window.Android[name]
                      === "function"
                  ) {

                      window.Android[name](value);

                  }

              } catch (error) {

              }

          }


          function vibration() {

              androidCall(
                  "vibration"
              );
          }


          /* ==========================================================
             CPU DOUBLE TAP
             ========================================================== */

          let cpuLastTap = 0;

          cpu.addEventListener(
              "pointerup",
              function(event) {

                  if (revealing) {
                      return;
                  }

                  if (moved) {
                      moved = false;
                      return;
                  }

                  const now =
                      Date.now();

                  if (
                      now -
                      cpuLastTap
                      < 350
                  ) {

                      cpuLastTap = 0;

                      startBrainBoot();

                  } else {

                      cpuLastTap = now;

                  }

              }
          );


          /* ==========================================================
             BRAIN 5 SECOND BOOT
             ========================================================== */

          function startBrainBoot() {

              if (
                  brainOnline ||
                  revealing
              ) {
                  return;
              }

              revealing = true;

              vibration();

              status.textContent =
                  "NEURAL CORE BOOTING • 0%";

              hint.textContent =
                  "Brain निर्माण हो रहा है...";

              cpu.style.opacity = "0";

              cpu.style.transform =
                  "scale(.72) rotateX(25deg)";

              cpu.style.pointerEvents =
                  "none";

              brain.classList.add(
                  "show"
              );

              const start =
                  performance.now();

              const duration =
                  5000;


              function animateBoot(
                  currentTime
              ) {

                  const elapsed =
                      currentTime -
                      start;

                  const raw =
                      Math.min(
                          1,
                          elapsed /
                          duration
                      );

                  /* smooth 5-second easing */

                  const eased =
                      1 -
                      Math.pow(
                          1 - raw,
                          3
                      );

                  const percent =
                      eased * 100;


                  brainReveal.style.clipPath =
                      "inset(" +
                      (100 - percent) +
                      "% 0 0 0)";


                  progress.style.width =
                      percent.toFixed(1) +
                      "%";


                  status.textContent =
                      "NEURAL CORE BOOTING • " +
                      Math.round(
                          percent
                      ) +
                      "%";


                  if (
                      raw < 1
                  ) {

                      requestAnimationFrame(
                          animateBoot
                      );

                  } else {

                      brainOnline =
                          true;

                      revealing =
                          false;

                      brainReveal.style.clipPath =
                          "inset(0% 0 0 0)";

                      progress.style.width =
                          "100%";

                      status.textContent =
                          "BRAIN ONLINE • ±90°";

                      hint.textContent =
                          "Brain को बाएँ/दाएँ drag करें • ±90° • Double Tap";

                      vibration();

                  }

              }


              requestAnimationFrame(
                  animateBoot
              );
          }


          /* ==========================================================
             BRAIN 3D LEFT / RIGHT ROTATION
             ========================================================== */

          brain.addEventListener(
              "pointerdown",
              function(event) {

                  if (
                      !brainOnline
                  ) {
                      return;
                  }

                  dragging = true;

                  moved = false;

                  startX =
                      event.clientX;

                  startRotation =
                      rotation;

                  brain.setPointerCapture?.(
                      event.pointerId
                  );

              }
          );


          brain.addEventListener(
              "pointermove",
              function(event) {

                  if (
                      !dragging ||
                      !brainOnline
                  ) {
                      return;
                  }

                  const dx =
                      event.clientX -
                      startX;

                  if (
                      Math.abs(dx) > 5
                  ) {

                      moved = true;

                  }

                  /*
                     Rotation limited
                     to -90 and +90
                  */

                  rotation =
                      Math.max(
                          -90,
                          Math.min(
                              90,
                              startRotation +
                              dx * 0.55
                          )
                      );

                  brain.style.setProperty(
                      "--rot",
                      rotation + "deg"
                  );

              }
          );


          brain.addEventListener(
              "pointerup",
              function() {

                  dragging = false;

              }
          );


          brain.addEventListener(
              "pointercancel",
              function() {

                  dragging = false;

              }
          );


          /* ==========================================================
             BRAIN DOUBLE TAP
             ========================================================== */

          brain.addEventListener(
              "pointerup",
              function(event) {

                  if (
                      !brainOnline ||
                      moved
                  ) {
                      return;
                  }

                  const now =
                      Date.now();

                  if (
                      now -
                      lastTap
                      < 350
                  ) {

                      lastTap = 0;

                      speakAssistant();

                  } else {

                      lastTap = now;

                  }

              }
          );


          function speakAssistant() {

              if (spoken) {
                  return;
              }

              spoken = true;

              status.textContent =
                  "ASSIST MODE READY";

              message.classList.add(
                  "show"
              );

              vibration();

              androidCall(
                  "speak",
                  "नमस्ते। मैं आपकी मदद के लिए तैयार हूँ। आप क्या करना चाहते हैं?"
              );


              setTimeout(
                  function() {

                      spoken = false;

                  },
                  5000
              );

          }


          /* ==========================================================
             BACKGROUND NEURAL MOTION
             ========================================================== */

          let pulseAngle = 0;

          function ambientAnimation() {

              pulseAngle += 0.02;

              if (
                  brainOnline &&
                  !dragging
              ) {

                  /*
                     बहुत हल्का cinematic
                     breathing effect
                  */

                  const breathing =
                      Math.sin(
                          pulseAngle
                      ) * 1.2;

                  brain.style.filter =
                      "drop-shadow(0 0 " +
                      (22 +
                          breathing) +
                      "px rgba(255,123,0,.38))";
              }

              requestAnimationFrame(
                  ambientAnimation
              );
          }

          ambientAnimation();


          /* ==========================================================
             PREVENT LONG-PRESS MENU
             ========================================================== */

          document.addEventListener(
              "contextmenu",
              function(event) {

                  event.preventDefault();

              }
          );


          </script>

          </body>

          </html>
          EOF


      # =========================================================
      # 16 - VERIFY NO OLD NOTICE CODE
      # =========================================================
      - name: 16 - Verify CPU Utility Project
        run: |
          set -euo pipefail

          echo "========================================="
          echo "CPU Utility Project Verification"
          echo "========================================="

          grep -R "com.cpuutility.app" app
          grep -R "CPU Utility" app

          if grep -R "com.zeeshan.notice" app; then
              echo "ERROR: Old Zeeshan Notice package found!"
              exit 1
          fi

          if grep -R "Zeeshan Notice" app; then
              echo "ERROR: Old Zeeshan Notice text found!"
              exit 1
          fi

          echo "Old Notice app removed successfully."
          echo "CPU Utility project is ready."


      # =========================================================
      # 17 - BUILD APK
      # =========================================================
      - name: 17 - Build CPU Utility Debug APK
        run: |
          set -euo pipefail

          gradle :app:assembleDebug --no-daemon

          test -f app/build/outputs/apk/debug/app-debug.apk

          echo "APK BUILD SUCCESSFUL"
          ls -lh app/build/outputs/apk/debug/app-debug.apk


      # =========================================================
      # 18 - RENAME APK
      # =========================================================
      - name: 18 - Rename APK
        run: |
          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/debug/CPU-Utility.apk

          ls -lh \
            app/build/outputs/apk/debug/CPU-Utility.apk


      # =========================================================
      # 19 - UPLOAD APK
      # =========================================================
      - name: 19 - Upload CPU Utility APK
        uses: actions/upload-artifact@v4
        with:
          name: CPU-Utility-APK
          path: app/build/outputs/apk/debug/CPU-Utility.apk
          if-no-files-found: error
