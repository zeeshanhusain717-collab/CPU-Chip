name: Build CPU Utility APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build CPU Utility Android APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 01 - CHECKOUT
      # =========================================================
      - name: 01 - Checkout Repository
        uses: actions/checkout@v4


      # =========================================================
      # 02 - JAVA 17
      # =========================================================
      - name: 02 - Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'


      # =========================================================
      # 03 - GRADLE
      # =========================================================
      - name: 03 - Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"


      # =========================================================
      # 04 - CLEAN OLD NOTICE APP COMPLETELY
      # =========================================================
      - name: 04 - Remove Old Zeeshan Notice App
        run: |
          set -euo pipefail

          rm -rf app
          rm -rf .gradle

          rm -f settings.gradle
          rm -f build.gradle
          rm -f gradle.properties

          mkdir -p app/src/main/java/com/cpuutility/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi


      # =========================================================
      # 05 - GRADLE PROPERTIES
      # =========================================================
      - name: 05 - Create Gradle Properties
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.daemon=false
          EOF


      # =========================================================
      # 06 - SETTINGS GRADLE
      # =========================================================
      - name: 06 - Create Settings Gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "CPUUtility"

          include(":app")
          EOF


      # =========================================================
      # 07 - ROOT BUILD GRADLE
      # =========================================================
      - name: 07 - Create Root Build Gradle
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.2.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          EOF


      # =========================================================
      # 08 - APP BUILD GRADLE
      # =========================================================
      - name: 08 - Create CPU Utility App Gradle
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }

          android {
              namespace "com.cpuutility.app"

              compileSdk 34

              defaultConfig {
                  applicationId "com.cpuutility.app"

                  minSdk 26
                  targetSdk 34

                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation "androidx.core:core-ktx:1.13.1"
              implementation "androidx.appcompat:appcompat:1.7.0"
          }
          EOF


      # =========================================================
      # 09 - COLORS
      # =========================================================
      - name: 09 - Create Colors
        run: |
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <color name="black">#000000</color>
              <color name="cpu_black">#010302</color>

              <color name="neon_green">#00FF88</color>
              <color name="neon_green_light">#7CFFD0</color>

              <color name="neon_orange">#FF7B00</color>
              <color name="neon_orange_light">#FFB35A</color>

              <color name="white">#FFFFFF</color>

          </resources>
          EOF


      # =========================================================
      # 10 - THEME
      # =========================================================
      - name: 10 - Create Theme
        run: |
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="Theme.CPUUtility"
                  parent="Theme.AppCompat.DayNight.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#00FF88</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF


      # =========================================================
      # 11 - MAIN LAYOUT
      # =========================================================
      - name: 11 - Create Main Layout
        run: |
          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <FrameLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">

              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="#000000" />

          </FrameLayout>
          EOF


      # =========================================================
      # 12 - SIMPLE APP ICON
      # =========================================================
      - name: 12 - Create CPU Utility Icon
        run: |
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <vector
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#050807"
                  android:pathData="M18,18 L90,18 L90,90 L18,90 Z" />

              <path
                  android:fillColor="#0B1813"
                  android:pathData="M28,28 L80,28 L80,80 L28,80 Z" />

              <path
                  android:fillColor="#00FF88"
                  android:pathData="M38,38 L70,38 L70,70 L38,70 Z" />

              <path
                  android:fillColor="#FF7B00"
                  android:pathData="M45,45 L63,45 L63,63 L45,63 Z" />

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M51,49 L57,49 L57,59 L51,59 Z" />

          </vector>
          EOF


      # =========================================================
      # 13 - ANDROID MANIFEST
      # =========================================================
      - name: 13 - Create Android Manifest
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="false"
                  android:fullBackupContent="false"
                  android:hardwareAccelerated="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="CPU Utility"
                  android:roundIcon="@drawable/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.CPUUtility">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # =========================================================
      # 14 - MAIN KOTLIN
      # =========================================================
      - name: 14 - Create MainActivity Kotlin
        run: |
          cat > app/src/main/java/com/cpuutility/app/MainActivity.kt <<'EOF'
          package com.cpuutility.app

          import android.annotation.SuppressLint
          import android.os.Bundle
          import android.os.Build
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.speech.tts.TextToSpeech
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.appcompat.app.AppCompatActivity
          import java.util.Locale

          class MainActivity :
              AppCompatActivity(),
              TextToSpeech.OnInitListener {

              private lateinit var webView: WebView

              private var textToSpeech: TextToSpeech? = null

              private var ttsReady = false

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  window.setFlags(
                      android.view.WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      android.view.WindowManager.LayoutParams.FLAG_FULLSCREEN
                  )

                  window.navigationBarColor =
                      android.graphics.Color.BLACK

                  setContentView(R.layout.activity_main)

                  textToSpeech =
                      TextToSpeech(this, this)

                  webView =
                      findViewById(R.id.webView)

                  webView.settings.apply {

                      javaScriptEnabled = true

                      domStorageEnabled = true

                      allowFileAccess = true

                      allowContentAccess = true

                      mediaPlaybackRequiresUserGesture = false

                      builtInZoomControls = false

                      displayZoomControls = false

                  }

                  webView.webViewClient =
                      WebViewClient()

                  webView.webChromeClient =
                      WebChromeClient()

                  webView.addJavascriptInterface(
                      AndroidBridge(),
                      "Android"
                  )

                  webView.loadUrl(
                      "file:///android_asset/index.html"
                  )
              }

              inner class AndroidBridge {

                  @JavascriptInterface
                  fun speak(message: String) {

                      runOnUiThread {

                          if (!ttsReady) {
                              return@runOnUiThread
                          }

                          textToSpeech?.speak(
                              message,
                              TextToSpeech.QUEUE_FLUSH,
                              null,
                              "CPU_UTILITY_MESSAGE"
                          )
                      }
                  }

                  @JavascriptInterface
                  fun vibration() {

                      runOnUiThread {

                          try {

                              val vibrator =
                                  getSystemService(
                                      VIBRATOR_SERVICE
                                  ) as Vibrator

                              if (
                                  Build.VERSION.SDK_INT >=
                                  Build.VERSION_CODES.O
                              ) {

                                  vibrator.vibrate(
                                      VibrationEffect.createOneShot(
                                          45L,
                                          VibrationEffect.DEFAULT_AMPLITUDE
                                      )
                                  )

                              } else {

                                  @Suppress(
                                      "DEPRECATION"
                                  )

                                  vibrator.vibrate(45L)
                              }

                          } catch (_: Exception) {
                          }
                      }
                  }
              }

              override fun onInit(status: Int) {

                  if (
                      status ==
                      TextToSpeech.SUCCESS
                  ) {

                      ttsReady = true

                      val result =
                          textToSpeech?.setLanguage(
                              Locale("hi", "IN")
                          )

                      if (
                          result ==
                          TextToSpeech.LANG_MISSING_DATA ||
                          result ==
                          TextToSpeech.LANG_NOT_SUPPORTED
                      ) {

                          textToSpeech?.language =
                              Locale.US
                      }

                      textToSpeech?.setSpeechRate(
                          0.92f
                      )

                      textToSpeech?.setPitch(
                          1.0f
                      )
                  }
              }

              override fun onDestroy() {

                  try {
                      textToSpeech?.stop()
                      textToSpeech?.shutdown()
                  } catch (_: Exception) {
                  }

                  try {
                      webView.destroy()
                  } catch (_: Exception) {
                  }

                  super.onDestroy()
              }
          }
          EOF


      # =========================================================
      # 15 - COMPLETE 3D CPU + BRAIN HTML
      # =========================================================
      - name: 15 - Create CPU Utility 3D Engine
        run: |
          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>

          <html lang="hi">

          <head>

          <meta charset="UTF-8">

          <meta
              name="viewport"
              content="width=device-width,
              initial-scale=1.0,
              maximum-scale=1.0,
              user-scalable=no">

          <title>CPU Utility</title>

          <style>

          :root {
              --green: #00ff88;
              --green2: #18d96f;
              --green3: #7cffd0;

              --orange: #ff7b00;
              --orange2: #ffb35a;

              --black: #000000;
              --dark: #010302;
          }

          * {
              box-sizing: border-box;

              -webkit-tap-highlight-color:
                  transparent;
          }

          html,
          body {

              width: 100%;
              height: 100%;

              margin: 0;

              padding: 0;

              overflow: hidden;

              background: #000;

              color: #fff;

              font-family:
                  Arial,
                  Helvetica,
                  sans-serif;

              touch-action: none;
          }

          body {

              display: flex;

              justify-content: center;

              align-items: center;

              background:

                  radial-gradient(
                      circle at 50% 42%,
                      rgba(
                          0,
                          255,
                          136,
                          .14
                      ),
                      transparent 30%
                  ),

                  radial-gradient(
                      circle at 50% 95%,
                      rgba(
                          255,
                          123,
                          0,
                          .11
                      ),
                      transparent 40%
                  ),

                  #010302;
          }

          #scene {

              position: relative;

              width: 100vw;

              height: 100vh;

              overflow: hidden;

              perspective: 1200px;
          }

          .scanlines {

              position: absolute;

              inset: 0;

              z-index: 50;

              pointer-events: none;

              opacity: .09;

              background:

                  repeating-linear-gradient(
                      to bottom,
                      transparent 0px,
                      transparent 3px,
                      rgba(
                          255,
                          255,
                          255,
                          .10
                      ) 4px
                  );
          }

          .topTitle {

              position: absolute;

              z-index: 40;

              top: 4%;

              left: 0;

              right: 0;

              text-align: center;

              font-size:
                  clamp(
                      14px,
                      4vw,
                      21px
                  );

              font-weight: 900;

              letter-spacing: 5px;

              color: var(--green3);

              text-shadow:

                  0 0 5px var(--green),

                  0 0 18px var(--green),

                  0 0 35px
                      rgba(
                          0,
                          255,
                          136,
                          .55
                      );
          }

          .status {

              position: absolute;

              z-index: 40;

              top: 10%;

              left: 0;

              right: 0;

              text-align: center;

              font-size: 10px;

              letter-spacing: 2px;

              color: #63ffb2;

              text-transform: uppercase;

              text-shadow:
                  0 0 10px var(--green);
          }

          .grid {

              position: absolute;

              left: -30%;

              right: -30%;

              bottom: -15%;

              height: 52%;

              transform:
                  perspective(550px)
                  rotateX(63deg);

              background:

                  linear-gradient(
                      rgba(
                          0,
                          255,
                          136,
                          .16
                      ) 1px,
                      transparent 1px
                  ),

                  linear-gradient(
                      90deg,
                      rgba(
                          0,
                          255,
                          136,
                          .16
                      ) 1px,
                      transparent 1px
                  );

              background-size:
                  45px 45px;

              opacity: .45;

              filter:
                  drop-shadow(
                      0 0 8px
                      rgba(
                          0,
                          255,
                          136,
                          .2
                      )
                  );
          }

          .stage {

              position: absolute;

              inset: 0;

              display: flex;

              justify-content: center;

              align-items: center;

              transform-style:
                  preserve-3d;
          }

          /* =====================================================
             CPU
             ===================================================== */

          .cpu {

              position: absolute;

              width:
                  min(
                      74vw,
                      340px
                  );

              height:
                  min(
                      74vw,
                      340px
                  );

              transform-style:
                  preserve-3d;

              cursor: pointer;

              transition:

                  opacity .6s ease,

                  transform .6s ease,

                  filter .6s ease;
          }

          .cpu-shell {

              position: absolute;

              inset: 0;

              border-radius: 30px;

              background:

                  linear-gradient(
                      145deg,
                      #283630,
                      #080d0b 48%,
                      #18211e
                  );

              border:
                  2px solid
                  rgba(
                      0,
                      255,
                      136,
                      .55
                  );

              box-shadow:

                  0 0 0 7px
                      rgba(
                          0,
                          255,
                          136,
                          .05
                      ),

                  0 0 40px
                      rgba(
                          0,
                          255,
                          136,
                          .30
                      ),

                  inset 0 0 55px
                      rgba(
                          0,
                          0,
                          0,
                          .95
                      );

              transform:
                  translateZ(0);
          }

          .cpu-shell::before {

              content: "";

              position: absolute;

              inset: 15px;

              border-radius: 22px;

              border:
                  1px solid
                  rgba(
                      0,
                      255,
                      136,
                      .28
                  );

              box-shadow:

                  inset 0 0 25px
                      rgba(
                          0,
                          255,
                          136,
                          .09
                      );
          }

          .cpu-shell::after {

              content: "";

              position: absolute;

              inset: -9px;

              border-radius: 35px;

              border:
                  1px solid
                  rgba(
                      255,
                      123,
                      0,
                      .28
                  );

              animation:
                  cpuPulse 2s
                  ease-in-out
                  infinite;
          }

          @keyframes cpuPulse {

              0% {
                  opacity: .25;
                  transform: scale(.98);
              }

              50% {
                  opacity: .8;
                  transform: scale(1.015);
              }

              100% {
                  opacity: .25;
                  transform: scale(.98);
              }
          }

          .chip {

              position: absolute;

              left: 50%;

              top: 50%;

              width: 58%;

              height: 58%;

              transform:
                  translate(-50%,-50%)
                  translateZ(35px);

              border-radius: 12px;

              background:

                  linear-gradient(
                      145deg,
                      #17231f,
                      #050807
                  );

              border:
                  2px solid
                  rgba(
                      255,
                      123,
                      0,
                      .55
                  );

              box-shadow:

                  0 0 25px
                      rgba(
                          0,
                          255,
                          136,
                          .25
                      ),

                  inset 0 0 35px
                      rgba(
                          0,
                          255,
                          136,
                          .14
                      );
          }

          .chip::before {

              content: "";

              position: absolute;

              inset: 14px;

              background:

                  repeating-linear-gradient(
                      0deg,
                      rgba(
                          0,
                          255,
                          136,
                          .18
                      ) 0px,
                      rgba(
                          0,
                          255,
                          136,
                          .18
                      ) 2px,
                      transparent 2px,
                      transparent 7px
                  );

              opacity: .8;
          }

          .chipText {

              position: absolute;

              inset: 0;

              display: flex;

              justify-content: center;

              align-items: center;

              flex-direction: column;

              text-align: center;

              z-index: 2;

              text-shadow:

                  0 0 8px var(--green),

                  0 0 20px var(--green);
          }

          .chipText strong {

              font-size:
                  clamp(
                      24px,
                      8vw,
                      42px
                  );

              letter-spacing: 3px;

              color: #d7ffe9;
          }

          .chipText small {

              margin-top: 5px;

              color: var(--orange2);

              font-size: 10px;

              letter-spacing: 3px;
          }

          .pin {

              position: absolute;

              background:
                  linear-gradient(
                      90deg,
                      #75451f,
                      #ffb35a,
                      #75451f
                  );

              box-shadow:
                  0 0 6px
                  rgba(
                      255,
                      123,
                      0,
                      .45
                  );
          }

          .pin.top,
          .pin.bottom {

              width: 65%;

              height: 5px;

              left: 17.5%;
          }

          .pin.left,
          .pin.right {

              width: 5px;

              height: 65%;

              top: 17.5%;
          }

          .pin.top {
              top: 5%;
          }

          .pin.bottom {
              bottom: 5%;
          }

          .pin.left {
              left: 5%;
          }

          .pin.right {
              right: 5%;
          }

          .led {

              position: absolute;

              width: 10px;

              height: 10px;

              border-radius: 50%;

              background: var(--green);

              box-shadow:

                  0 0 6px var(--green),

                  0 0 18px var(--green),

                  0 0 30px var(--green);

              animation:
                  ledBlink
                  1.15s
                  ease-in-out
                  infinite;
          }

          .led:nth-child(1) {
              left: 12%;
              top: 12%;
          }

          .led:nth-child(2) {
              right: 12%;
              top: 12%;
              animation-delay: .2s;
          }

          .led:nth-child(3) {
              left: 12%;
              bottom: 12%;
              animation-delay: .4s;
          }

          .led:nth-child(4) {
              right: 12%;
              bottom: 12%;
              animation-delay: .6s;
          }

          @keyframes ledBlink {

              0%,
              100% {
                  opacity: .25;
                  transform: scale(.75);
              }

              50% {
                  opacity: 1;
                  transform: scale(1.25);
              }
          }

          /* =====================================================
             BRAIN
             ===================================================== */

          .brain {

              position: absolute;

              width:
                  min(
                      82vw,
                      390px
                  );

              height:
                  min(
                      82vw,
                      390px
                  );

              display: flex;

              justify-content: center;

              align-items: center;

              opacity: 0;

              pointer-events: none;

              transform:
                  perspective(1000px)
                  rotateY(var(--rot,0deg))
                  rotateX(4deg)
                  scale(.72);

              transform-style:
                  preserve-3d;

              transition:
                  opacity .8s ease,
                  transform .15s ease;

              filter:
                  drop-shadow(
                      0 0 22px
                      rgba(
                          255,
                          123,
                          0,
                          .35
                      )
                  );
          }

          .brain.show {

              opacity: 1;

              pointer-events: auto;

              transform:
                  perspective(1000px)
                  rotateY(var(--rot,0deg))
                  rotateX(4deg)
                  scale(1);
          }

          .brainFrame {

              position: absolute;

              width: 100%;

              height: 100%;

              display: flex;

              justify-content: center;

              align-items: center;

              transform-style:
                  preserve-3d;
          }

          .brainGlow {

              position: absolute;

              width: 75%;

              height: 70%;

              border-radius: 50%;

              background:

                  radial-gradient(
                      ellipse,
                      rgba(
                          255,
                          116,
                          0,
                          .26
                      ),
                      transparent 67%
                  );

              filter:
                  blur(10px);

              animation:
                  brainGlow 2s
                  ease-in-out
                  infinite;
          }

          @keyframes brainGlow {

              0% {
                  transform: scale(.92);
                  opacity: .45;
              }

              50% {
                  transform: scale(1.05);
                  opacity: .9;
              }

              100% {
                  transform: scale(.92);
                  opacity: .45;
              }
          }

          .brainSvg {

              width: 100%;

              height: 100%;

              overflow: visible;

              filter:
                  drop-shadow(
                      0 0 8px
                      rgba(
                          255,
                          123,
                          0,
                          .8
                      )
                  );
          }

          .brainPath {

              fill:

                  url(#brainGradient);

              stroke:
                  #ff9a32;

              stroke-width: 3;

              stroke-linejoin: round;

              filter:
                  drop-shadow(
                      0 0 5px
                      #ff7b00
                  );
          }

          .fold {

              fill: none;

              stroke:
                  #ffcc8a;

              stroke-width: 3;

              stroke-linecap: round;

              opacity: .9;

              filter:
                  drop-shadow(
                      0 0 3px
                      #ff7b00
                  );
          }

          .fold2 {

              fill: none;

              stroke:
                  #00ffb0;

              stroke-width: 2;

              stroke-linecap: round;

              opacity: .7;

              filter:
                  drop-shadow(
                      0 0 4px
                      #00ff88
                  );
          }

          .neuron {

              fill:
                  #00ff9d;

              filter:
                  drop-shadow(
                      0 0 6px
                      #00ff88
                  );

              animation:
                  neuronPulse
                  1.5s
                  ease-in-out
                  infinite;
          }

          @keyframes neuronPulse {

              0% {
                  opacity: .3;
                  r: 2;
              }

              50% {
                  opacity: 1;
                  r: 5;
              }

              100% {
                  opacity: .3;
                  r: 2;
              }
          }

          #brainReveal {

              clip-path:
                  inset(
                      100% 0 0 0
                  );

              transition:
                  clip-path .1s linear;
          }

          #brainProgress {

              position: absolute;

              left: 16%;

              right: 16%;

              bottom: 7%;

              height: 5px;

              border-radius: 10px;

              background:
                  rgba(
                      0,
                      255,
                      136,
                      .12
                  );

              overflow: hidden;

              box-shadow:
                  0 0 8px
                  rgba(
                      0,
                      255,
                      136,
                      .25
                  );
          }

          #brainProgress span {

              display: block;

              width: 0%;

              height: 100%;

              border-radius: 10px;

              background:
                  linear-gradient(
                      90deg,
                      #00ff88,
                      #ff7b00
                  );

              box-shadow:
                  0 0 12px
                  #00ff88;
          }

          .message {

              position: absolute;

              z-index: 45;

              left: 7%;

              right: 7%;

              bottom: 12%;

              padding:
                  15px 18px;

              border-radius: 16px;

              border:
                  1px solid
                  rgba(
                      0,
                      255,
                      136,
                      .45
                  );

              background:
                  rgba(
                      0,
                      15,
                      10,
                      .90
                  );

              color:
                  #d9ffed;

              text-align: center;

              font-size: 13px;

              line-height: 1.5;

              opacity: 0;

              transform:
                  translateY(15px);

              transition:
                  .4s ease;

              box-shadow:

                  0 0 25px
                      rgba(
                          0,
                          255,
                          136,
                          .12
                      );
          }

          .message.show {

              opacity: 1;

              transform:
                  translateY(0);
          }

          .hint {

              position: absolute;

              z-index: 40;

              bottom: 4%;

              left: 5%;

              right: 5%;

              text-align: center;

              font-size: 9px;

              letter-spacing: .7px;

              color:
                  rgba(
                      220,
                      255,
                      238,
                      .55
                  );
          }

          .corner {

              position: absolute;

              z-index: 35;

              width: 45px;

              height: 45px;

              border-color:
                  rgba(
                      0,
                      255,
                      136,
                      .45
                  );

              border-style: solid;
          }

          .corner.tl {

              top: 18%;

              left: 5%;

              border-width:
                  2px 0 0 2px;
          }

          .corner.tr {

              top: 18%;

              right: 5%;

              border-width:
                  2px 2px 0 0;
          }

          .corner.bl {

              bottom: 14%;

              left: 5%;

              border-width:
                  0 0 2px 2px;
          }

          .corner.br {

              bottom: 14%;

              right: 5%;

              border-width:
                  0 2px 2px 0;
          }

          </style>

          </head>

          <body>

          <div id="scene">

              <div class="scanlines"></div>

              <div class="topTitle">
                  CPU UTILITY
              </div>

              <div
                  class="status"
                  id="status">
                  CPU CORE • STANDBY
              </div>

              <div class="grid"></div>

              <div class="corner tl"></div>
              <div class="corner tr"></div>
              <div class="corner bl"></div>
              <div class="corner br"></div>

              <div class="stage">

                  <!-- =================================================
                       CPU
                       ================================================= -->

                  <div
                      class="cpu"
                      id="cpu">

                      <div class="cpu-shell">

                          <div class="pin top"></div>
                          <div class="pin bottom"></div>
                          <div class="pin left"></div>
                          <div class="pin right"></div>

                          <div class="led"></div>
                          <div class="led"></div>
                          <div class="led"></div>
                          <div class="led"></div>

                          <div class="chip">

                              <div class="chipText">

                                  <strong>
